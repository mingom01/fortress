/* ---------------- 시드 난수 (온라인 동기화용) ----------------
   지형·바람·스폰·선공처럼 "양쪽이 똑같아야 하는" 값만 이 PRNG 를 쓴다.
   파티클 같은 연출은 그냥 Math.random 을 써도 desync 가 나지 않는다. */
let rngState = 1, gameSeed = 1;
function srand(s){ rngState = (s>>>0) || 1; }
function sr(){
  rngState = (rngState + 0x6D2B79F5) | 0;
  let t = Math.imul(rngState ^ (rngState>>>15), 1 | rngState);
  t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t;
  return ((t ^ (t>>>14)) >>> 0) / 4294967296;
}
const srnd = (a,b)=> a + sr()*(b-a);

const teamOf   = i => i & 1;

function foesOf(t){ return tanks.filter(o => !o.dead && teamOf(o.i) !== teamOf(t.i)); }
/* 가장 가까운 적 — 능력·유도의 기준점 */
function foeOf(t){
  const f = foesOf(t);
  if(!f.length) return null;
  let best = f[0], bd = Infinity;
  for(const o of f){ const d = Math.abs(o.x - t.x); if(d < bd){ bd = d; best = o; } }
  return best;
}

/* 보호막: 상대 포탄이 날아가는 동안 SHIFT 로 전개. 2초간 모든 피해 무효 */

/* ---------------- 사운드 (WebAudio) ---------------- */
let AC = null;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type='square', vol=0.12, slide=0){
  const a = ac(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, a.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), a.currentTime+dur);
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0008, a.currentTime+dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur+0.02);
}
function noiseBuf(){
  const a = ac(); if(!a) return null;
  if(noiseBuf._b) return noiseBuf._b;
  const b = a.createBuffer(1, a.sampleRate*1.2, a.sampleRate);
  const d = b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  return noiseBuf._b = b;
}
function boom(size=1){
  const a = ac(); if(!a) return;
  const s = a.createBufferSource(); s.buffer = noiseBuf();
  const f = a.createBiquadFilter(); f.type='lowpass';
  f.frequency.setValueAtTime(2200*size, a.currentTime);
  f.frequency.exponentialRampToValueAtTime(90, a.currentTime+0.5*size);
  const g = a.createGain();
  g.gain.setValueAtTime(0.45, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+0.55*size);
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(); s.stop(a.currentTime+0.6*size);
  const o = a.createOscillator(), og = a.createGain();
  o.type='sine'; o.frequency.setValueAtTime(120, a.currentTime);
  o.frequency.exponentialRampToValueAtTime(35, a.currentTime+0.4);
  og.gain.setValueAtTime(0.4, a.currentTime);
  og.gain.exponentialRampToValueAtTime(0.001, a.currentTime+0.45);
  o.connect(og); og.connect(a.destination); o.start(); o.stop(a.currentTime+0.5);
}
/* 비행중 "퓨유유융" 휘파람 */
let whistle = null;
function whistleStart(){
  const a = ac(); if(!a || whistle) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type='sine'; o.frequency.setValueAtTime(760, a.currentTime);
  g.gain.setValueAtTime(0.0001, a.currentTime);
  g.gain.linearRampToValueAtTime(0.09, a.currentTime+0.05);
  o.connect(g); g.connect(a.destination); o.start();
  whistle = {o,g};
}
function whistleSet(vy){
  if(!whistle) return; const a = ac();
  // 슬로우모션에서는 음도 같이 늘어진다
  const f = clamp(300 - vy*55, 110, 900) * (slowmo > 0 ? 0.55 : (RID()==='speed' ? 1.3 : 1));
  whistle.o.frequency.setTargetAtTime(f, a.currentTime, 0.05);
}
function whistleStop(){
  if(!whistle) return; const a = ac();
  whistle.g.gain.setTargetAtTime(0.0001, a.currentTime, 0.03);
  const w = whistle; setTimeout(()=>{ try{w.o.stop();}catch(e){} }, 200);
  whistle = null;
}
let charge = null;
function chargeStart(){
  const a = ac(); if(!a || charge) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type='triangle'; o.frequency.setValueAtTime(120, a.currentTime);
  g.gain.setValueAtTime(0.05, a.currentTime);
  o.connect(g); g.connect(a.destination); o.start();
  charge = {o,g};
}
function chargeSet(p){
  if(!charge) return; const a = ac();
  charge.o.frequency.setTargetAtTime(120 + p*6, a.currentTime, 0.02);
}
function chargeStop(){
  if(!charge) return; try{ charge.o.stop(); }catch(e){}
  charge = null;
}

/* ---------------- BGM (8비트 시퀀서) ----------------
   외부 파일 없이 WebAudio 로 직접 연주한다. 오디오 시계 기준으로 미리 예약하기 때문에
   프레임이 끊겨도 박자가 흔들리지 않는다. */
const NOTE = {};
(()=>{ const names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  for(let o=1;o<=6;o++) names.forEach((n,i)=>{ NOTE[n+o] = 440*Math.pow(2,(o*12+i-57)/12); });
})();
const N = s => s === '.' ? 0 : NOTE[s];

/* 각 트랙: [베이스, 리드, 드럼]. '.' 는 쉼표, 한 칸 = 8분음표 */
const TRACKS = {
  menu: { bpm:96, gain:0.5,
    bass:'A2..A2..E2..E2..F2..F2..G2..G2..',
    lead:'A4.C5.E5.C5.B4.D5.F5.D5.C5.E5.A5.E5.D5.B4.G4..',
    drum:'x...x...x...x...x...x...x...x...' },
  battle: { bpm:132, gain:0.55,
    bass:'D2.D2.D2..A2.D2.D2.C2..G2.A#1.A#1.F2..C2.',
    lead:'D4.A4.D5.A4.F5.E5.D5.C5.A#4.F4.A#4.D5.C5.A4.F4..',
    drum:'x.h.x.h.x.h.xhh.x.h.x.h.x.h.xhx.' },
  tense: { bpm:150, gain:0.5,           // 스피드전 / 벼랑끝
    bass:'E2E2E2E2A#1A#1A#1A#1E2E2E2E2G2G2F2F2',
    lead:'E5.A#4.E5.G5.F5.E5.C5.A#4.E5.A#5.G5.F5.E5.C5.A#4.',
    drum:'xhxhxhxhxhxhxhxhxhxhxhxhxhxhxhxh' },
};

const music = {
  on:true, cur:null, next:0, step:0, timer:null, gain:null, key:''
};
function musicGain(){
  const a = ac(); if(!a) return null;
  if(!music.gain){ music.gain = a.createGain(); music.gain.gain.value = 0.5; music.gain.connect(a.destination); }
  return music.gain;
}
function mnote(freq, t, dur, type, vol){
  const a = ac(), g0 = musicGain(); if(!a || !g0 || !freq) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0008, t+dur);
  o.connect(g); g.connect(g0); o.start(t); o.stop(t+dur+0.02);
}
function mdrum(kind, t){
  const a = ac(), g0 = musicGain(); if(!a || !g0) return;
  const s = a.createBufferSource(); s.buffer = noiseBuf();
  const f = a.createBiquadFilter(); const g = a.createGain();
  if(kind === 'x'){ f.type='lowpass'; f.frequency.setValueAtTime(240, t); g.gain.setValueAtTime(0.5, t);
                    g.gain.exponentialRampToValueAtTime(0.001, t+0.16); }
  else            { f.type='highpass'; f.frequency.setValueAtTime(6000, t); g.gain.setValueAtTime(0.13, t);
                    g.gain.exponentialRampToValueAtTime(0.001, t+0.05); }
  s.connect(f); f.connect(g); g.connect(g0); s.start(t); s.stop(t+0.2);
}
/* 패턴 문자열을 8분음표 칸으로 자른다 ('A#2' 처럼 두세 글자인 음도 처리) */
function parsePat(p){
  const out = []; let i = 0;
  while(i < p.length){
    if(p[i] === '.'){ out.push('.'); i++; continue; }
    let j = i+1;
    while(j < p.length && (p[j] === '#' || (p[j] >= '0' && p[j] <= '9'))) j++;
    out.push(p.slice(i, j)); i = j;
  }
  return out;
}
const patCache = {};
function pat(track, name){
  const k = track+'|'+name;
  if(!patCache[k]) patCache[k] = parsePat(TRACKS[track][name]);
  return patCache[k];
}
function musicPick(){
  if(state === 'title' || state === 'menu' || state === 'lobby') return 'menu';
  if(state === 'over') return null;
  if(RID() === 'speed' || slowmo > 0) return 'tense';
  return 'battle';
}
function musicTick(){
  if(!music.on) return;
  const a = ac(); if(!a) return;
  const want = musicPick();
  if(want !== music.key){ music.key = want; music.step = 0; music.next = a.currentTime + 0.06; }
  if(!want) return;
  const T = TRACKS[want];
  const spb = 60 / T.bpm / 2;                 // 8분음표 길이
  while(music.next < a.currentTime + 0.25){   // 250ms 앞까지 미리 예약
    const t = music.next, s = music.step;
    const b = pat(want,'bass'), l = pat(want,'lead'), d = pat(want,'drum');
    const bn = b[s % b.length], ln = l[s % l.length], dn = d[s % d.length];
    if(bn !== '.') mnote(N(bn), t, spb*1.7, 'square',   0.055*T.gain);
    if(ln !== '.') mnote(N(ln), t, spb*0.9, 'square',   0.032*T.gain);
    if(dn === 'x' || dn === 'h') mdrum(dn, t);
    music.next += spb; music.step++;
  }
}
function musicToggle(){
  music.on = !music.on;
  if(!music.on && music.gain){ try{ music.gain.gain.value = 0; }catch(e){} }
  else if(music.gain){ music.gain.gain.value = 0.5; music.key=''; }
  say(music.on ? '♪ 음악 켜짐' : '♪ 음악 꺼짐');
  try{ localStorage.setItem('fortress.bgm', music.on ? '1' : '0'); }catch(e){}
}

/* ---------------- 지형 (픽셀 단위 파괴) ---------------- */
/* 0 = 빈 공간, 1 풀, 2 흙, 3 암반, 4 그을음 */
const terr = new Uint8Array(W*H);
const terrCv = document.createElement('canvas');
terrCv.width = W; terrCv.height = H;
const terrCtx = terrCv.getContext('2d');
let terrImg = terrCtx.createImageData(W,H);
let terrDirty = true;

function setPix(x,y,r,g,b,a){
  const i = (y*W+x)*4;
  terrImg.data[i]=r; terrImg.data[i+1]=g; terrImg.data[i+2]=b; terrImg.data[i+3]=a;
}
const solid = (x,y)=> x>=0 && x<W && y>=0 && y<H && terr[y*W+x]!==0;

/* 중점 변위법 능선 */
function ridge(disp, lo, hi){
  const N = 1024;
  const h = new Float32Array(N+1);
  h[0] = srnd(lo,hi); h[N] = srnd(lo,hi);
  let step = N, d = disp;
  while(step > 1){
    const half = step>>1;
    for(let i=half;i<N;i+=step) h[i] = (h[i-half]+h[i+half])/2 + srnd(-d,d);
    step = half; d *= 0.52;
  }
  const top = new Float32Array(W);
  for(let x=0;x<W;x++){
    const t = x/(W-1)*N;
    const i = Math.floor(t), f = t-i;
    top[x] = h[i]*(1-f) + h[Math.min(N,i+1)]*f;
  }
  return top;
}
function smooth(top, n){
  for(let k=0;k<n;k++){
    const c = Float32Array.from(top);
    for(let x=1;x<W-1;x++) top[x] = (c[x-1]+c[x]*2+c[x+1])/4;
  }
  return top;
}

/* top[x] = 지표면 y. H 이상이면 그 열은 허공(바닥 없음) */
function genTerrain(mapId){
  if(mapId === 'random' || !mapId)
    mapId = MAPS[Math.floor(sr()*(MAPS.length-1))].id;
  curMap = mapId;

  terr.fill(0);
  terrImg = terrCtx.createImageData(W,H);

  let top, bot = null, ceil = null;
  if(mapId === 'plain'){
    top = smooth(ridge(26, 244, 266), 3);
    for(let x=0;x<W;x++) top[x] = clamp(top[x], 205, H-22);

  } else if(mapId === 'peak'){
    top = ridge(135, 140, 250);
    for(let x=0;x<W;x++) top[x] = clamp(top[x], 74, H-22);

  } else if(mapId === 'canyon'){
    top = smooth(ridge(52, 170, 220), 2);
    for(let x=0;x<W;x++){
      const k = Math.max(0, 1 - Math.abs(x - W/2)/78);
      const dip = Math.pow(k, 0.65);
      top[x] = top[x] + dip*(H - 12 - top[x]);
      top[x] = clamp(top[x], 96, H-4);
    }

  } else if(mapId === 'plateau'){
    const yl = srnd(140,175), yr = srnd(150,185), valley = srnd(268, 292);
    top = ridge(14, 0, 8);
    for(let x=0;x<W;x++){
      let base;
      if(x < 214) base = yl;
      else if(x > W-214) base = yr;
      else base = valley;
      top[x] = clamp(base + top[x], 90, H-18);
    }

  } else if(mapId === 'island'){
    top = smooth(ridge(58, 190, 240), 2);
    const gap = 78;            // 중앙 공백 반폭
    for(let x=0;x<W;x++){
      const d = Math.abs(x - W/2);
      if(d < gap){ top[x] = H + 10; continue; }
      // 섬 가장자리는 안쪽으로 갈수록 깎여 내려간다
      const edge = clamp((d - gap)/46, 0, 1);
      top[x] = clamp(top[x] + (1-edge)*70, 120, H-16);
    }

  } else if(mapId === 'abyss'){
    // 가운데가 바닥 없는 낭떠러지. 떨어지면 즉사
    top = smooth(ridge(28, 198, 236), 3);
    const gap = 108;
    for(let x=0;x<W;x++){
      if(Math.abs(x - W/2) < gap){ top[x] = H + 10; continue; }
      top[x] = clamp(top[x], 150, H-40);
    }

  } else if(mapId === 'wall'){
    // 중앙에 하늘까지 솟은 장벽
    top = smooth(ridge(34, 240, 268), 2);
    for(let x=0;x<W;x++) top[x] = clamp(top[x], 210, H-22);
    const half = 30;
    for(let x=Math.round(W/2-half); x<W/2+half; x++){
      const e = Math.abs(x - W/2)/half;
      top[x] = Math.min(top[x], 40 + e*e*22);
    }

  } else if(mapId === 'crust'){
    // 얇은 지각. 아래는 허공
    top = smooth(ridge(30, 236, 262), 3);
    bot = new Float32Array(W);
    for(let x=0;x<W;x++){
      top[x] = clamp(top[x], 214, 268);
      bot[x] = top[x] + 15 + Math.sin(x*0.021)*3;
    }

  } else if(mapId === 'steps'){
    // 계단식 피라미드. 단차 8px이라 기어오를 수 있다
    top = new Float32Array(W);
    const lv = 11, base = 292;
    for(let x=0;x<W;x++){
      const d = Math.abs(x - W/2)/(W/2);
      top[x] = base - Math.floor((1-d)*lv)*8;
    }

  } else if(mapId === 'cavern'){
    // 중앙에 천장이 덮인 굴. 낮게 쏴야 통과한다
    top = smooth(ridge(30, 244, 266), 3);
    for(let x=0;x<W;x++) top[x] = clamp(top[x], 232, H-22);
    ceil = new Float32Array(W);
    const span = 198;
    for(let x=0;x<W;x++){
      const d = Math.abs(x - W/2)/span;
      ceil[x] = d >= 1 ? 0 : 186*(1 - d*d);
    }

  } else { // hill
    top = smooth(ridge(95, 180, 250), 2);
    for(let x=0;x<W;x++) top[x] = clamp(top[x], 96, H-26);
  }

  for(let x=0;x<W;x++) top[x] = Math.round(top[x]);
  if(bot)  for(let x=0;x<W;x++) bot[x]  = Math.round(bot[x]);
  if(ceil) for(let x=0;x<W;x++) ceil[x] = Math.round(ceil[x]);

  // d = 지표면으로부터의 깊이
  function paint(x,y,d){
    const m = d<5 ? 1 : d<58 ? 2 : 3;
    terr[y*W+x] = m;
    let r,g,b;
    const n = ((Math.sin(x*0.37+y*0.11)*0.5+0.5)*10)|0;
    if(m===1){ r=98+n; g=196+n; b=74+n; if(d===0){ r=140; g=232; b=110; } }
    else if(m===2){ r=132+n; g=88+n; b=52+n; if(((y+ (x>>3))%14)===0){ r-=18; g-=12; b-=8; } }
    else { r=74+n; g=70+n; b=84+n; if(((y+(x>>2))%9)===0){ r+=12; g+=12; b+=16; } }
    setPix(x,y,r,g,b,255);
  }

  for(let x=0;x<W;x++){
    const b = bot ? Math.min(bot[x], H) : H;
    for(let y=Math.max(0,top[x]); y<b; y++) paint(x, y, y-top[x]);
    if(ceil){                       // 천장은 아래로 자란 암반
      const cb = ceil[x];
      for(let y=0; y<cb; y++) paint(x, y, 60 + (cb-y));
    }
  }
  terrDirty = true;
  return top;
}

function carve(cx,cy,r){
  cx|=0; cy|=0;
  const r2 = r*r, rb = (r+3)*(r+3);
  const y0 = Math.max(0,cy-r-3), y1 = Math.min(H-1,cy+r+3);
  const x0 = Math.max(0,cx-r-3), x1 = Math.min(W-1,cx+r+3);
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    const dx=x-cx, dy=y-cy, d=dx*dx+dy*dy, i=y*W+x;
    if(d<=r2){ if(terr[i]){ terr[i]=0; setPix(x,y,0,0,0,0); } }
    else if(d<=rb && terr[i] && terr[i]!==4){ terr[i]=4; setPix(x,y, 46+((x*7+y*3)%10), 32, 26, 255); }
  }
  cleanSpikes(x0-8, x1+8);
  terrDirty = true;
}

/* 폭발 뒤에 남는 좁고 뾰족한 흙기둥을 깎아낸다.
   CLIMB(9px) 보다 높으면서 폭이 좁은 턱은 전차를 그 자리에 가둬버리기 때문에,
   양옆보다 우뚝 솟은 6px 이하 폭의 조각은 주변 높이까지 밀어낸다. */
function surfTop(x){
  let y = 0;
  while(y < H && !solid(x,y)) y++;
  return y;                                  // 지면이 없으면 H
}
function cleanSpikes(xa, xb){
  xa = Math.max(1, xa|0); xb = Math.min(W-2, xb|0);
  if(xb <= xa) return;
  const top = new Int32Array(xb-xa+1);
  for(let x=xa;x<=xb;x++) top[x-xa] = surfTop(x);
  for(let x=xa+1; x<=xb-1; x++){
    const h = top[x-xa];
    if(h >= H) continue;
    for(let w=1; w<=6; w++){                 // 폭 1~6px 짜리 조각만 본다
      const L = x-1, Rt = x+w;
      if(Rt > xb) break;
      let flat = true;                       // 조각 윗면이 평평한가
      for(let k=0;k<w;k++) if(Math.abs(top[x+k-xa] - h) > 2){ flat = false; break; }
      if(!flat) break;                       // 더 넓혀도 평평해지지 않는다
      const lh = top[L-xa], rh = top[Rt-xa];
      const drop = Math.min(lh, rh) - h;      // 양옆보다 이만큼 솟아 있다
      if(drop <= CLIMB) continue;             // 아직 넘어갈 수 있다 → 더 넓은 폭을 본다
      if(drop >= 140) break;                  // 지형의 일부지 조각이 아니다
      const cut = Math.min(lh, rh) - CLIMB;   // 넘어갈 수 있는 높이까지만 남긴다
      for(let k=0;k<w;k++){
        const xx = x+k;
        for(let y=top[xx-xa]; y<cut && y<H; y++){
          const i = y*W+xx;
          if(terr[i]){ terr[i]=0; setPix(xx,y,0,0,0,0); }
        }
        top[xx-xa] = cut;
      }
      break;
    }
  }
}

const CTRL = [
  {up:'KeyW', down:'KeyS', left:'KeyA', right:'KeyD',
   fire:['Space'], label:'W A S D + SPACE'},
  {up:'ArrowUp', down:'ArrowDown', left:'ArrowLeft', right:'ArrowRight',
   fire:['Enter','NumpadEnter'], label:'방향키 + ENTER'},
];
const BLOCK = ['Space','Enter','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Backspace'];

/* 왼쪽/오른쪽 SHIFT 판별.
   e.code 가 먼저지만, 배열/IME 사정으로 code 가 비거나 뭉개지는 환경이 있어
   e.location (1=왼쪽, 2=오른쪽) 과 legacy keyCode 까지 순서대로 확인한다. */
const SHIFT_ANY = 2;               // SHIFT 는 맞는데 좌우를 못 가리는 경우
function shiftSide(e){
  if(e.code === 'ShiftLeft')  return 0;
  if(e.code === 'ShiftRight') return 1;
  if(e.key === 'Shift' || e.keyCode === 16){
    if(e.location === 2) return 1;   // DOM_KEY_LOCATION_RIGHT
    if(e.location === 1) return 0;   // DOM_KEY_LOCATION_LEFT
    return SHIFT_ANY;
  }
  return -1;
}

const keys = {};
addEventListener('keydown', e=>{
  if(BLOCK.includes(e.code)) e.preventDefault();
  if(e.repeat) return;
  ac();
  const sh = shiftSide(e);
  if(sh >= 0){ shieldKey(sh); return; }
  onKey(e.code, true);
  keys[e.code] = true;
});
addEventListener('keyup', e=>{
  if(shiftSide(e) >= 0) return;
  keys[e.code] = false;
  onKey(e.code, false);
});

/* Digit3 / Numpad3 → 3, 그 외엔 0 */
function digitOf(code){
  const m = /^(?:Digit|Numpad)([1-9])$/.exec(code);
  return m ? +m[1] : 0;
}

/* 온라인에서는 각자 자기 키보드를 통째로 쓰므로 두 조작계를 모두 받는다 */
function isFireKey(k, t){
  if(net.on) return k==='Space' || k==='Enter' || k==='NumpadEnter';
  return CTRL[teamOf(t.i)].fire.includes(k);
}

function onKey(k, down){
  if(down && k === 'KeyB'){ musicToggle(); return; }
  if(state === 'title'){ if(down){ state = 'menu'; tone(660,0.07,'square',0.09); } return; }
  if(state === 'menu'){ if(down) menuKey(k); return; }
  if(state === 'lobby'){ if(down) lobbyKey(k); return; }
  // 초능력: 1P = Q, 2P = / (물음표 키). 온라인에서는 둘 다 내 전차에 걸린다
  if(down && (k === 'KeyQ' || k === 'Slash' || k === 'NumpadDivide')){
    useAbility(net.on ? net.myIdx : (k === 'KeyQ' ? 0 : 1), false);
    return;
  }
  if(state === 'over'){
    if(!down) return;
    if(k==='KeyH'){ replayStart(); return; }
    if(replay.playing){ replay.playing = false; return; }   // 아무 키나 누르면 리플레이 중단
    // 리그 진행중이면 SPACE/ENTER 로 다음 판
    if((k==='Space'||k==='Enter'||k==='NumpadEnter') && leagueOn() && !league.done){
      tone(880,0.1,'square',0.11,220); nextLeagueGame(); return;
    }
    if(k==='KeyR'){
      if(net.on){ netSend({t:'rematch'}); say('재대결 요청...'); if(net.role==='host') netRecv({t:'rematch'}); }
      else startGame();
    }
    else if(k==='KeyM'||k==='Escape'){
      if(net.on){ netSend({t:'bye'}); netClose(); }
      state='menu'; tone(440,0.07,'square',0.09);
    }
    return;
  }
  if(state !== 'aim') return;
  const t = tanks[turn];
  if(t.com) return;                              // COM 턴에는 입력 무시
  if(net.on && turn !== net.myIdx) return;       // 온라인: 상대 턴엔 입력 무시

  const d = digitOf(k);
  if(down && d >= 1 && d <= WEAPONS.length){
    if(RID() === 'random') return nope('랜덤전 — 정해진 포탄만 쏠 수 있다');
    if(RID() === 'basic')  return nope('기본전 — 노말탄만 쓸 수 있다');
    const n = d-1;
    if(t.ammo[n] > 0){ t.weapon = n; tone(880,0.05,'square',0.08); say(WEAPONS[n].name+' — '+WEAPONS[n].tip); }
    else { tone(180,0.09,'sawtooth',0.08); say('탄약 없음'); }
  }
  if(isFireKey(k, t)){
    if(down){ holding = true; holdP = 0; holdDir = 1; chargeStart(); }
    else if(holding){
      holding = false; chargeStop();
      const pw = Math.max(4, holdP);
      if(net.on) netSend({t:'fire', x:t.x, y:t.y, a:t.angle, w:t.weapon, p:pw});
      fire(t, pw);
    }
  }
}

/* 점멸 — 날아오는 탄에서 최대한 먼 착지점을 고른다.
   탄의 현재 위치가 아니라 탄도를 앞으로 굴려 "어디에 떨어질지"를 보고 판단한다. */
const BLINK = 58;
function blinkSpot(t){
  let src = null;
  for(const p of shots) if(p.owner !== t.i){ src = p; break; }

  let danger = null;
  if(src){                                   // 탄이 어디로 향하는지 예측
    let x = src.x, y = src.y, vx = src.vx, vy = src.vy;
    for(let s=0; s<400; s++){
      vy += G; vx += wind*0.0013;
      x += vx; y += vy;
      if(x < -60 || x > W+60 || y > H+40) break;
      if(y >= 0 && solid(x|0, y|0)) break;
    }
    danger = x;
  } else { const f = foeOf(t); danger = f ? f.x : t.x; }   // 탄이 없으면 상대에게서 멀어진다

  // 후보 착지점 중 위험 지점에서 가장 먼 곳
  let best = t.x, bestD = Math.abs(t.x - danger);
  for(const dir of [1,-1]) for(const d of [BLINK, BLINK*0.75, BLINK*0.5]){
    const nx = Math.round(clamp(t.x + dir*d, TW+1, W-TW-2));
    if(Math.abs(nx - t.x) < 6) continue;
    if(groundSpawnY(nx) >= H-6) continue;     // 허공에는 안 간다
    const dd = Math.abs(nx - danger);
    if(dd > bestD){ bestD = dd; best = nx; }
  }
  return best;
}

/* byNet = 상대가 쓴 것을 재생하는 중 (검사 생략, 메시지 재전송 금지) */
function useAbility(i, byNet, arg){
  const t = tanks[i];
  if(!t || t.dead) return false;
  if(RID() !== 'power') return byNet ? false : nope('능력전에서만 쓸 수 있다');
  if(t.abil < 0) return false;
  if(!byNet){
    if(t.com) return false;
    if(net.on && i !== net.myIdx) return false;
    if(t.abilUses <= 0) return nope(label(i)+' 능력 충전 없음 — '+(HITS_PER_USE - t.hits%HITS_PER_USE)+'번 더 맞히면 충전');
    if(state !== 'aim' && state !== 'fly' && state !== 'settle') return false;
  }
  const A = ABILITIES[t.abil];
  const e = foeOf(t);
  t.abilUses--; t.stat.abilUsed++;

  switch(A.id){
    case 'cloak':
      t.cloak = 2;                       // 2턴 유지
      tone(300,0.4,'sine',0.12,900);
      for(let k=0;k<20;k++) parts.push({x:t.x+rnd(-10,10), y:t.y-rnd(0,14),
        vx:rnd(-.5,.5), vy:rnd(-1.2,-.2), l:.6, c:'#9ad8ff', g:0, s:2});
      break;

    case 'bolt': {
      if(!e || e.dead) break;
      const bx = e.x;
      for(let y=0; y<e.y-12; y+=4)                      // 하늘에서 내리꽂는 섬광
        parts.push({x:bx+Math.sin(y*0.15)*7, y, vx:0, vy:0, l:.45, c:'#fff06a', g:0, s:3});
      carve(bx, e.y-2, 16);
      hurt(e, 45, '⚡');
      shake = Math.max(shake, 12); flash = 0.9;
      boom(1.1); tone(2200,0.3,'sawtooth',0.14,-1900);
      break;
    }
    case 'amp':
      t.amp = true; tone(160,0.3,'square',0.13,420);
      break;

    case 'regen': {
      const before = t.hp;
      t.hp = Math.min(t.maxHp, t.hp + 25);
      floats.push({x:t.x, y:t.y-TH-10, v:-0.45, l:1.5, s:'+'+(t.hp-before), c:'#7affa0'});
      for(let k=0;k<18;k++) parts.push({x:t.x+rnd(-9,9), y:t.y-rnd(0,12),
        vx:rnd(-.3,.3), vy:rnd(-1.4,-.4), l:.7, c:'#7affa0', g:-0.01, s:2});
      tone(520,0.3,'sine',0.12,400);
      break;
    }
    case 'venom':
      t.venom = true; tone(220,0.35,'sawtooth',0.11,180);
      break;

    case 'blink': {
      const nx = (arg !== undefined) ? arg : blinkSpot(t);
      for(let k=0;k<16;k++) parts.push({x:t.x, y:t.y-6, vx:rnd(-2,2), vy:rnd(-2,2), l:.4, c:'#6cf0c8', g:0, s:2});
      t.x = nx; t.y = groundSpawnY(nx); t.fall = 0;
      t.iframe = 2;                                      // 착지 후 2초간 무적
      for(let k=0;k<16;k++) parts.push({x:t.x, y:t.y-6, vx:rnd(-2,2), vy:rnd(-2,2), l:.4, c:'#6cf0c8', g:0, s:2});
      tone(1200,0.2,'sine',0.12,-700);
      if(!byNet && net.on) netSend({t:'abil', i, arg:nx});
      say(label(i)+' 점멸 회피!');
      return true;                                       // 아래 공통 전송을 건너뛴다
    }
    case 'homing':
      t.homing = true; tone(340,0.35,'triangle',0.12,-140);
      break;

    case 'quake': {
      for(let x=0; x<W; x++){                            // 표면을 한 겹씩 깎아낸다
        let y = 0;
        while(y < H && !solid(x,y)) y++;
        for(let k=0; k<9 && y+k < H; k++){ terr[(y+k)*W+x] = 0; setPix(x,y+k,0,0,0,0); }
      }
      terrDirty = true;
      if(e && !e.dead) hurt(e, 30, '지진');
      shake = Math.max(shake, 14);
      boom(1.4); tone(90,0.7,'sawtooth',0.14,-40);
      if(state === 'aim'){ settleReturn = turn; state = 'settle'; }   // 턴은 넘기지 않는다
      break;
    }

    case 'tank': {                                       // 탱커 — 보호막 재충전
      t.shieldUses++;
      floats.push({x:t.x, y:t.y-TH-10, v:-0.4, l:1.5, s:'보호막 +1', c:'#8fa0d8'});
      for(let k=0;k<18;k++){
        const a = k/18*Math.PI*2;
        parts.push({x:t.x+Math.cos(a)*18, y:t.y-6+Math.sin(a)*18,
          vx:-Math.cos(a)*.8, vy:-Math.sin(a)*.8, l:.5, c:'#8fa0d8', g:0, s:2});
      }
      tone(240,0.4,'square',0.12,260);
      break;
    }

    case 'mage':                                         // 마법사 — 다음 포탄이 불꽃탄
      t.flame = true;
      tone(520,0.45,'sawtooth',0.13,620);
      for(let k=0;k<22;k++) parts.push({x:t.x+rnd(-10,10), y:t.y-rnd(0,14),
        vx:rnd(-.6,.6), vy:rnd(-1.6,-.3), l:.7, c:k%2?'#ff5c9a':'#ffb04a', g:-0.02, s:2});
      break;
  }
  say(label(i)+' 능력 — '+A.name);
  if(!byNet && net.on) netSend({t:'abil', i});
  return true;
}

/* ---------------- 보호막 ---------------- */
const SIDE = ['왼쪽','오른쪽'];
function nope(s){ say(s); tone(160,0.11,'sawtooth',0.075); return false; }

/* SHIFT 눌렀을 때의 입구. 왜 안 되는지 항상 화면에 알려준다 */
function shieldKey(i){
  if(state === 'title' || state === 'menu' || state === 'lobby' || state === 'over') return false;
  if(state !== 'fly' && state !== 'settle')
    return nope((i===SHIFT_ANY?'':SIDE[i]+' ')+'SHIFT — 보호막은 상대 포탄이 날아오는 동안에만');
  if(net.on) i = net.myIdx;     // 온라인: 좌우 상관없이 항상 내 전차
  else if(i === SHIFT_ANY){     // 브라우저가 좌우를 못 알려주면 방어중인 쪽으로
    i = 1 - turn;
    say('좌우 SHIFT 구분 불가 — '+label(i)+' 보호막으로 처리');
  }
  const ok = tryShield(i, false);
  if(ok && net.on) netSend({t:'shield'});
  return ok;
}

function tryShield(i, byCom){
  const t = tanks[i];
  if(!t || t.dead) return false;
  if(!byCom && t.com) return nope('COM 전차의 보호막은 조작할 수 없다');
  if(turn === i) return nope(label(i)+' 자기 턴에는 보호막을 쓸 수 없다');
  if(t.shield > 0) return nope(label(i)+' 보호막 이미 전개중');
  if(t.shieldUses <= 0) return nope(label(i)+' 보호막 소진');
  t.shieldUses--; t.shield = SHIELD_TIME; t.stat.shieldUsed++;
  say(label(i)+' 보호막 전개! ('+t.shieldUses+'회 남음)');
  tone(420,0.35,'triangle',0.13,760);
  tone(880,0.25,'sine',0.08,420);
  for(let k=0;k<24;k++){
    const a = k/24*Math.PI*2;
    parts.push({x:t.x+Math.cos(a)*22, y:t.y-6+Math.sin(a)*22,
      vx:-Math.cos(a)*1.3, vy:-Math.sin(a)*1.3, l:.5, c:'#6cf0c8', g:0, s:2});
  }
  return true;
}

/* 메뉴는 양쪽 키를 모두 받는다 */
const MENU_ROWS = 6;
function cycleColor(idx, d){
  let v = colSel[idx];
  do { v = (v + d + PALETTE.length) % PALETTE.length; } while(v === colSel[1-idx]);
  colSel[idx] = v;
}
function menuKey(k){
  if(k==='ArrowUp'||k==='KeyW'||k==='ArrowDown'||k==='KeyS'){
    const d = (k==='ArrowDown'||k==='KeyS') ? 1 : -1;
    menuRow = (menuRow + d + MENU_ROWS) % MENU_ROWS;
    tone(520,0.04,'square',0.07); return;
  }
  if(k==='ArrowLeft'||k==='KeyA'||k==='ArrowRight'||k==='KeyD'){
    const d = (k==='ArrowRight'||k==='KeyD') ? 1 : -1;
    if(menuRow===0){
      mode = (mode + d + MODES.length) % MODES.length;
    }
    else if(menuRow===1) rule = (rule + d + RULES.length) % RULES.length;
    else if(menuRow===2) leagueSel = (leagueSel + d + LEAGUES.length) % LEAGUES.length;
    else if(menuRow===3) mapSel = (mapSel + d + MAPS.length) % MAPS.length;
    else                 cycleColor(menuRow-4, d);
    tone(760,0.04,'square',0.08);
    return;
  }
  if(k==='Space'||k==='Enter'||k==='NumpadEnter'){
    tone(880,0.1,'square',0.11,220);
    if(isOnline()){ state = 'lobby'; lobby = 'choose'; net.err = ''; joinCode = ''; }
    else { netClose(); startGame(); }
  }
}
function label(i){
  if(tanks[i] && tanks[i].com) return isQuad() ? 'COM'+(i+1) : 'COM';
  const base = (i+1)+'P';
  return (net.on && i===net.myIdx) ? base+'(나)' : base;
}

/* ---------------- 로비 ---------------- */
let lobbyPick = 0;              // 0 = 방 만들기, 1 = 참가하기
function lobbyKey(k){
  if(k==='Escape'){
    netClose();
    if(lobby==='joining'||lobby==='error'){ lobby='choose'; net.err=''; }
    else { state='menu'; }
    tone(440,0.06,'square',0.08);
    return;
  }
  if(lobby === 'error'){
    if(k==='Space'||k==='Enter'||k==='NumpadEnter'){ lobby='choose'; net.err=''; }
    return;
  }
  if(lobby === 'choose'){
    if(k==='ArrowLeft'||k==='KeyA'||k==='ArrowRight'||k==='KeyD'){
      lobbyPick = 1-lobbyPick; tone(760,0.04,'square',0.08); return;
    }
    if(k==='Space'||k==='Enter'||k==='NumpadEnter'){
      tone(880,0.09,'square',0.11,200);
      if(lobbyPick===0) netHost();
      else { lobby='joining'; joinCode=''; }
    }
    return;
  }
  if(lobby === 'joining'){
    if(k==='Backspace'){ joinCode = joinCode.slice(0,-1); tone(300,0.03,'square',0.06); return; }
    if(k==='Space'||k==='Enter'||k==='NumpadEnter'){
      if(joinCode.length===4) netJoin(joinCode);
      else { say('4자리 코드를 입력하세요'); tone(180,0.1,'sawtooth',0.08); }
      return;
    }
    // 코드 입력 — 물리 키 위치에서 글자를 뽑아 한/영 상태를 타지 않는다
    let ch = '';
    const mL = /^Key([A-Z])$/.exec(k);
    const mD = /^(?:Digit|Numpad)([0-9])$/.exec(k);
    if(mL) ch = mL[1];
    else if(mD) ch = mD[1];
    if(ch && CODE_CHARS.includes(ch) && joinCode.length < 4){
      joinCode += ch; tone(700,0.03,'square',0.07);
    }
    return;
  }
}

/* ---------------- 조준 / 이동 ---------------- */
function aimUpdate(dt){
  const t = tanks[turn];
  // 온라인에서 상대 턴이면 화면만 갱신하고 입력은 받지 않는다
  if(net.on && turn !== net.myIdx){ timer -= dt; return; }
  const c = CTRL[teamOf(t.i)];
  const kUp    = net.on ? (keys.KeyW || keys.ArrowUp)    : keys[c.up];
  const kDown  = net.on ? (keys.KeyS || keys.ArrowDown)  : keys[c.down];
  const kLeft  = net.on ? (keys.KeyA || keys.ArrowLeft)  : keys[c.left];
  const kRight = net.on ? (keys.KeyD || keys.ArrowRight) : keys[c.right];
  if(kUp)   t.angle = clamp(t.angle + t.dir*80*dt, 0, 180);
  if(kDown) t.angle = clamp(t.angle - t.dir*80*dt, 0, 180);
  if(!holding){
    let mv = 0;
    if(kLeft)  mv = -1;
    if(kRight) mv = +1;
    if(mv && isStunned(t)){ mv = 0; moveAcc = 0; say('지뢰에 묶여 이동 불가'); }
    if(mv && t.moves > 0){
      moveAcc += 60*dt;
      while(moveAcc >= 1 && t.moves > 0){
        moveAcc -= 1;
        const nx = clamp(t.x + mv, TW+1, W-TW-2);
        const ny = surfaceY(nx, t.y);
        if(ny < t.y - CLIMB){ moveAcc = 0; say('턱이 너무 높다'); break; }  // 벽
        t.x = nx; t.y = ny; t.moves--;
        if((t.moves & 3) === 0) tone(70,0.03,'square',0.04);
        checkMines(t);
        if(isStunned(t)){ moveAcc = 0; break; }
      }
    } else moveAcc = 0;
  }
  if(holding){
    holdP += holdDir*62*dt;
    // 100 에 닿으면 도로 내려오고, 0 에 닿으면 다시 올라간다
    if(holdP >= 100){ holdP = 100; holdDir = -1; tone(1000,0.05,'square',0.07,-420); }
    else if(holdP <= 0){ holdP = 0; holdDir = 1; tone(300,0.05,'square',0.07,300); }
    chargeSet(holdP);
  }
  timer -= dt;
  if(timer <= 0){
    if(holding){ holding=false; chargeStop(); }
    say('시간 초과!');
    const pw = Math.max(4, holdP||50);
    if(net.on) netSend({t:'fire', x:t.x, y:t.y, a:t.angle, w:t.weapon, p:pw});
    fire(t, pw);
  }
}
let moveAcc = 0;

function muzzle(t, len){
  const a = t.angle*Math.PI/180;
  return { x: t.x + Math.cos(a)*len, y: (t.y-TH) - Math.sin(a)*len, a };
}

function fire(t, power){
  if(RID() === 'basic') t.weapon = 0;
  const w = WEAPONS[t.weapon];
  t.power = power;
  if(t.ammo[t.weapon] !== Infinity) t.ammo[t.weapon]--;
  const m = muzzle(t, 15);
  const v = power*0.09;
  fireSeq++;                        // 한 번의 발사를 묶는 번호 (다연장 분열탄도 공유)
  t.stat.shots++;
  shots.push({
    fid: fireSeq,
    x:m.x, y:m.y, px:m.x, py:m.y,
    vx:Math.cos(m.a)*v, vy:-Math.sin(m.a)*v,
    w, owner:t.i, dig:0, split:false, life:0,
    amp: !!t.amp, venom: !!t.venom, homing: !!t.homing, flame: !!t.flame
  });
  trail = [];
  // 발사 화염
  for(let i=0;i<14;i++)
    parts.push({x:m.x, y:m.y, vx:Math.cos(m.a)*rnd(1,3.5)+rnd(-.6,.6),
      vy:-Math.sin(m.a)*rnd(1,3.5)+rnd(-.6,.6), l:rnd(.15,.4), c:'#ffd27a', g:0.02, s:2});
  shake = Math.max(shake, 3);
  tone(420, 0.12, 'square', 0.16, -300);
  boom(0.45);
  whistleStart();
  state = 'fly'; simAcc = 0; slowmo = 0;
  t.amp = t.venom = t.homing = t.flame = false;   // 이번 턴짜리 버프는 발사와 함께 소모
  if(t.ammo[t.weapon] === 0) t.weapon = 0;
  // COM 은 날아오는 포탄을 보고 반응해서 보호막을 켠다
  comShieldT = -1; comShieldWho = -1;
  const defender = tanks.find(c => c.com && !c.dead && teamOf(c.i) !== teamOf(t.i)
                                   && c.shieldUses > 0 && c.shield <= 0);
  if(defender && Math.random() < 0.5){ comShieldT = rnd(0.3,0.9); comShieldWho = defender.i; }
}

/* ---------------- 포탄 물리 ---------------- */
const G = 0.14;
const SIM_STEP = 1/60;
const HOME_R = 165;              // 유도탄이 표적을 빨아들이기 시작하는 거리
const HITS_PER_USE = 2;          // 이만큼 맞힐 때마다 능력 1회 충전
let fireSeq = 0;                 // 발사 일련번호 — 분열탄의 중복 명중 집계를 막는다
let settleReturn = null;         // 능력으로 인한 정착 — 끝나면 이 턴으로 돌아간다
let simAcc = 0, slowmo = 0;      // slowmo > 0 이면 결정타 연출 중

function simSpeed(){
  if(slowmo > 0) return 0.14;              // 결정타 슬로우모션
  if(RID() === 'speed') return 2.1;        // 스피드전
  return 1;
}

/* 슬로우모션 발동 조건:
   ① 지금 날아가는 탄이 맞으면 끝나는 "결정탄" 이고 표적에 근접했을 때
   ② 양쪽 모두 체력 20 이하인 벼랑끝 상황 */
function updateSlowmo(){
  if(!shots.length){ slowmo = 0; return; }
  // 살아있는 전차가 모두 빈사면 어느 한 발로 끝날 수 있다
  const alive = tanks.filter(t=>!t.dead);
  const both = alive.length >= 2 && alive.every(t=>t.hp <= 20);
  let kill = false;
  for(const p of shots){
    for(const t of tanks){
      if(t.dead || t.i === p.owner) continue;
      if(t.hp > p.w.dmg * (p.amp ? AMP_X : 1)) continue;    // 맞아도 안 죽으면 결정탄이 아니다
      if(Math.hypot(p.x - t.x, p.y - (t.y-5)) < 42){ kill = true; break; }
    }
    if(kill) break;
  }
  if(kill || both){
    if(slowmo <= 0){                       // 진입 순간
      tone(180, 0.5, 'sine', 0.1, -60);
      say(kill ? '결정타!' : '벼랑 끝');
    }
    slowmo = 1;
  } else slowmo = 0;
}
function flyUpdate(){
  for(let si=shots.length-1; si>=0; si--){
    const p = shots[si];
    p.px = p.x; p.py = p.y;                   // 렌더 보간용 직전 위치
    p.vy += G;
    p.vx += wind*0.0013;
    // 유도: 상대 근처까지만 가면 알아서 빨려든다. 은신 중인 표적은 못 잡는다.
    if(p.homing){
      const e = foeOf(tanks[p.owner]);
      if(e && !e.dead && e.cloak <= 0){
        // 차체 중심을 노리면 앞쪽 지면에 먼저 처박힌다. 포탑 높이를 겨냥한다.
        const tx = e.x, ty = e.y - TH - 1;
        const d = Math.hypot(tx-p.x, ty-p.y);
        if(d > 1 && d < HOME_R){
          const sp = Math.hypot(p.vx, p.vy);
          const ux = (tx-p.x)/d, uy = (ty-p.y)/d;
          if(d < 30){                      // 최종 유도 — 완전히 조준선에 올린다
            p.vx = ux*sp; p.vy = uy*sp;
          } else {
            const k = 0.26 * (1 - d/HOME_R) + 0.05;
            p.vx += (ux*sp - p.vx) * k;
            p.vy += (uy*sp - p.vy) * k;
          }
        }
      }
    }
    p.life++;

    // 다연장: 정점에서 분열
    if(p.w.id === 'mirv' && !p.split && p.vy >= 0 && p.life > 12){
      p.split = true;
      shots.splice(si,1);
      for(let k=-1;k<=1;k++)
        shots.push({fid:p.fid, x:p.x, y:p.y, px:p.x, py:p.y,
          vx:p.vx + k*0.85, vy:p.vy - 0.4 + Math.abs(k)*0.25,
          w:p.w, owner:p.owner, dig:0, split:true, life:0,
          amp:p.amp, venom:p.venom, homing:p.homing, flame:p.flame});
      for(let i=0;i<12;i++) parts.push({x:p.x,y:p.y,vx:rnd(-2,2),vy:rnd(-2,1),l:rnd(.2,.5),c:'#ff7ad0',g:0.03,s:2});
      tone(1200,0.1,'square',0.1,-600);
      continue;
    }

    const steps = Math.max(1, Math.ceil(Math.hypot(p.vx,p.vy)/1.5));
    let done = false;
    for(let s=0;s<steps && !done;s++){
      p.x += p.vx/steps; p.y += p.vy/steps;

      // 요격기 판정
      if(p.x < -60 || p.x > W+60){ shots.splice(si,1); done = true; break; }
      if(p.y > H+40){ shots.splice(si,1); done = true; say('빗나감'); break; }

      // 탱크 직격
      for(const t of tanks){
        if(t.dead) continue;
        if(Math.abs(p.x-t.x) < TW+2 && p.y > t.y-TH-2 && p.y < t.y+2){
          explode(p, p.x, p.y, 1); shots.splice(si,1); done = true; break;
        }
      }
      if(done) break;

      // 지형
      if(p.y >= 0 && solid(p.x|0, p.y|0)){
        if(p.w.id === 'dig'){
          if(p.dig === 0){ p.dig = 1; tone(260,0.2,'sawtooth',0.12,-160); }
          p.dig++;
          carve(p.x, p.y, 8);
          for(let i=0;i<2;i++) parts.push({x:p.x,y:p.y,vx:rnd(-1,1),vy:rnd(-1.5,0),l:.35,c:'#a9743f',g:.05,s:2});
          if(p.dig > 80 || p.y > H-4){
            explode(p, p.x, p.y, 1); shots.splice(si,1); done = true;
          }
        } else {
          explode(p, p.x, p.y, 1); shots.splice(si,1); done = true;
        }
      }
    }
    if(!done){
      if(p.life % 2 === 0)
        parts.push({x:p.x, y:p.y, vx:rnd(-.2,.2), vy:rnd(-.2,.1), l:rnd(.3,.7), c:'#8a8fa8', g:-0.01, s:1, smoke:1});
      if(p.life % 2 === 0) trail.push({x:p.x, y:p.y});
    }
  }
  if(shots.length){
    let best = shots[0];
    for(const p of shots) if(p.vy < best.vy) best = p;
    whistleSet(best.vy);
  } else {
    whistleStop();
    state = 'settle';
  }
}

/* ---------------- COM (1인용) ---------------- */
let ai = null;

/* 탄도를 미리 굴려보고 목표까지의 최소 접근 거리를 반환 */
function simShot(t, angle, power, e){
  const a = angle*Math.PI/180;
  let x = t.x + Math.cos(a)*15, y = (t.y-TH) - Math.sin(a)*15;
  let vx = Math.cos(a)*power*0.09, vy = -Math.sin(a)*power*0.09;
  let best = 1e9;
  const ex = e.x, ey = e.y-5;
  for(let i=0;i<700;i++){
    vy += G; vx += wind*0.0013;
    const steps = Math.max(1, Math.ceil(Math.hypot(vx,vy)/1.5));
    for(let s=0;s<steps;s++){
      x += vx/steps; y += vy/steps;
      const d = Math.hypot(x-ex, y-ey);
      if(d < best) best = d;
      if(x < -60 || x > W+60 || y > H+40) return best;
      if(Math.abs(x-e.x) < TW+2 && y > e.y-TH-2 && y < e.y+2) return 0;
      if(y >= 0 && solid(x|0, y|0)) return best;
    }
  }
  return best;
}

function aiSearch(t, e){
  let best = {d:1e9, elev:45, power:60};
  for(let elev=12; elev<=86; elev+=4)
    for(let pw=22; pw<=100; pw+=4){
      const d = simShot(t, t.dir>0?elev:180-elev, pw, e);
      if(d < best.d) best = {d, elev, power:pw};
    }
  const b = best;
  for(let elev=b.elev-4; elev<=b.elev+4; elev++)
    for(let pw=b.power-4; pw<=b.power+4; pw++){
      if(pw < 10 || pw > 100 || elev < 6 || elev > 89) continue;
      const d = simShot(t, t.dir>0?elev:180-elev, pw, e);
      if(d < best.d) best = {d, elev, power:pw};
    }
  return best;
}

function aiPlan(){
  const t = tanks[turn], e = foeOf(t);
  if(!e) return;
  const b = aiSearch(t, e);
  // 초탄은 가늠 사격, 쏠수록 정밀해진다
  const ae = t.comFired===0 ? 4.5 : t.comFired===1 ? 3.0 : 1.8;
  const ap = t.comFired===0 ? 9.0 : t.comFired===1 ? 6.0 : 3.5;
  let elev = b.elev + rnd(-ae,ae);
  let pw   = clamp(b.power + rnd(-ap,ap), 8, 100);
  t.comFired++;

  // 조준이 잘 잡혔으면 특수탄을 아낌없이 쓴다
  let wp = 0;
  if(b.d < 16 && t.ammo[1] > 0 && Math.random() < 0.45) wp = 1;         // 광역탄
  else if(b.d < 26 && t.ammo[4] > 0 && Math.random() < 0.3) wp = 4;      // 방사능탄
  else if(b.d < 22 && t.ammo[5] > 0 && Math.random() < 0.3) wp = 5;      // 다연장
  else if(b.d > 40 && t.ammo[2] > 0 && Math.random() < 0.25) wp = 2;     // 땅굴탄
  t.weapon = wp;

  ai = {phase:'think', wait:0.8, tAngle: t.dir>0?elev:180-elev, tPower:pw};
}

function aiUpdate(dt){
  const t = tanks[turn];
  if(!ai) aiPlan();
  timer -= dt;

  if(ai.phase === 'think'){
    ai.wait -= dt;
    if(ai.wait <= 0) ai.phase = 'turn';
    return;
  }
  if(ai.phase === 'turn'){
    const d = ai.tAngle - t.angle;
    const step = 105*dt;
    if(Math.abs(d) <= step){
      t.angle = ai.tAngle;
      ai.phase = 'charge';
      holding = true; holdP = 0; holdDir = 1; chargeStart();
    } else t.angle += Math.sign(d)*step;
    return;
  }
  if(ai.phase === 'charge'){
    holdP += 62*dt;
    chargeSet(holdP);
    if(holdP >= ai.tPower){
      holding = false; chargeStop();
      fire(t, clamp(ai.tPower, 4, 100));
      ai = null;
    }
  }
}

/* ---------------- 폭발 ---------------- */
function explode(p, x, y, scale){
  const w = p.w;
  const r = w.r * scale * (p && p.flame ? 2.4 : 1);   // 불꽃탄은 범위가 압도적이다
  carve(x, y, r);
  if(p && p.flame){
    for(let k=0;k<70;k++){
      const a = rnd(0,Math.PI*2), sp = rnd(0.4, 2.4);
      parts.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-1.1, l:rnd(.6,1.6),
        c: k%3===0?'#fff2b0' : k%3===1?'#ff5c9a':'#ffb04a', g:-0.02, s: k%4===0?3:2});
    }
    tone(180,0.8,'sawtooth',0.14,-70);
  }
  boom(clamp(r/26,0.6,1.8));
  shake = Math.max(shake, 4 + r*0.28);
  flash = Math.min(1, 0.25 + r/150);

  const n = 20 + (r|0);
  for(let i=0;i<n;i++){
    const a = rnd(0,Math.PI*2), sp = rnd(0.6, 2.2+r*0.09);
    parts.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-0.6, l:rnd(.25,.75),
      c: i%3===0 ? '#fff2b0' : i%3===1 ? w.color : '#ff8a3c', g:0.09, s: i%4===0?3:2});
  }
  for(let i=0;i<12;i++)
    parts.push({x, y, vx:rnd(-1.2,1.2), vy:rnd(-1.6,-.2), l:rnd(.6,1.3), c:'#6a6f85', g:-0.012, s:3, smoke:1});
  parts.push({ring:1, x, y, r:2, max:r*1.9, l:0.34, c:w.color});

  // 데미지: 가까울수록 강하게
  const dr = r*1.75;
  const ampX = p && p.amp ? AMP_X : 1;             // 강화탄
  for(const t of tanks){
    if(t.dead) continue;
    const d = Math.hypot(x - t.x, y - (t.y-5));
    if(d < dr){
      let dmg = w.dmg * Math.pow(1 - d/dr, 1.35);
      if(d < 8) dmg = w.dmg;                       // 완전 직격
      dmg = Math.round(dmg * ampX);
      if(dmg > 0){
        // 은신은 완전 회피지만, 보호막은 "맞은 것"으로 쳐준다
        const dodged = t.cloak > 0 || t.iframe > 0;
        const hpBefore = t.hp;
        hurt(t, dmg, d < 10 ? (ampX>1?'강화 직격!':'직격!') : '');
        const done = hpBefore - t.hp;          // 보호막·은신에 막히면 0
        const foe = p && p.owner !== undefined && t.i !== p.owner;
        // 명중률·누적 피해 (다연장 한 발사는 1회로 친다)
        if(foe && p.fid !== undefined){
          const sh0 = tanks[p.owner];
          if(sh0){
            sh0.stat.dmg += done;
            if(done > sh0.stat.best) sh0.stat.best = done;
            if(!dodged && sh0.statFid !== p.fid){ sh0.statFid = p.fid; sh0.stat.hits++; }
          }
        }
        if(foe && !dodged && RID() === 'power'){
          const sh = tanks[p.owner];
          // 다연장은 3발이 터져도 "한 번 맞힌 것". 발사 번호로 중복 적립을 막는다.
          if(sh && !sh.dead && sh.lastFid !== p.fid){
            sh.lastFid = p.fid;
            sh.hits++;
            if(sh.hits % HITS_PER_USE === 0){        // 충전은 상한 없이 쌓인다
              sh.abilUses++;
              floats.push({x:sh.x, y:sh.y-TH-22, v:-0.4, l:1.8, s:'능력 +1 (×'+sh.abilUses+')', c:'#ffd24a'});
              tone(880,0.18,'square',0.12,440);
            }
          }
        }
        // 맹독 / 화상 — 능력을 쓰고 맞혀야 걸리는 대신 아프다
        const stick = foe && !dodged && t.shield <= 0 && d < dr*0.85;
        if(p && p.venom && stick){
          t.poison = 3; t.poisonDmg = 25;
          floats.push({x:t.x, y:t.y-TH-20, v:-0.4, l:1.4, s:'중독', c:'#c07aff'});
        }
        if(p && p.flame && stick){
          t.burn = 4; t.burnDmg = 22;
          floats.push({x:t.x, y:t.y-TH-20, v:-0.4, l:1.4, s:'화상', c:'#ff5c9a'});
        }
      }
    }
  }

  if(w.id === 'rad'){
    zones.push({x, y, r:74, turns:4, t:0});
    tone(240,0.6,'sawtooth',0.09,-90);
    say('☢ 오염 지대 발생 — 4턴간 유지');
  }
  if(w.id === 'mine'){
    // 땅에 박힌다. 시간이 지나도 사라지지 않는다.
    const my = groundSpawnY(Math.round(clamp(x, 2, W-3))) - 2;
    mines.push({x:Math.round(x), y: my < H-2 ? my : Math.round(y), r:MINE_R, owner:p.owner, t:0});
    tone(1400,0.22,'triangle',0.1,-500);
    say(label(p.owner)+' 지뢰 설치 — 밟으면 한 턴 묶인다');
  }
}

/* 지뢰 판정. 밟으면 땅은 멀쩡하고 소리와 함께 한 턴 묶인다. */
const MINE_R = 52, MINE_DMG = 10;
const RAD_DMG = 10;              // 방사능 지대 안에 있을 때 턴당 피해
const isStunned = t => t && round < t.stunUntil;
function checkMines(t){
  if(!t || t.dead) return;
  for(let k=mines.length-1; k>=0; k--){
    const m = mines[k];
    if(Math.hypot(t.x - m.x, (t.y-5) - m.y) > m.r) continue;
    mines.splice(k,1);                    // 밟은 지뢰는 터졌으니 사라진다
    // 자기 턴 두 번을 묶는다 (인원수와 무관하게 성립)
    t.stunUntil = round + tanks.length*2;
    floats.push({x:t.x, y:t.y-TH-14, v:-0.42, l:1.6, s:'지뢰! 2턴 이동 불가', c:'#6cf0c8'});
    hurt(t, MINE_DMG, '지뢰');
    for(let i=0;i<26;i++){
      const a = rnd(0,Math.PI*2), sp = rnd(0.5,2.4);
      parts.push({x:m.x, y:m.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-1, l:rnd(.3,.8),
        c: i%2 ? '#6cf0c8' : '#fff2b0', g:0.07, s:2});
    }
    parts.push({ring:1, x:m.x, y:m.y, r:2, max:44, l:0.3, c:'#6cf0c8'});
    boom(0.5); tone(320,0.18,'square',0.13,-200);
    shake = Math.max(shake, 6);
    break;
  }
}

function hurt(t, dmg, tag){
  if(t.iframe > 0){                       // 점멸 직후 무적
    floats.push({x:t.x, y:t.y-TH-8, v:-0.42, l:1.2, s:'회피', c:'#6cf0c8'});
    tone(1100,0.1,'sine',0.08,-400);
    return;
  }
  if(t.cloak > 0){                        // 은신 중에는 아예 통과한다
    floats.push({x:t.x, y:t.y-TH-8, v:-0.42, l:1.2, s:'MISS', c:'#9ad8ff'});
    tone(900,0.1,'sine',0.08,-400);
    return;
  }
  if(t.shield > 0){                       // 보호막이 전부 막는다
    floats.push({x:t.x, y:t.y-TH-8, v:-0.42, l:1.3, s:'BLOCK', c:'#6cf0c8'});
    for(let i=0;i<14;i++){
      const a = rnd(0,Math.PI*2);
      parts.push({x:t.x+Math.cos(a)*20, y:t.y-6+Math.sin(a)*20,
        vx:Math.cos(a)*rnd(.6,2), vy:Math.sin(a)*rnd(.6,2), l:.45, c:'#9af0f0', g:0.02, s:2});
    }
    tone(1300,0.12,'square',0.11,-500);
    return;
  }
  t.lastHitBy = tag || '';        // 마무리 연출용
  t.hp -= dmg;
  t.stat.taken += dmg;
  floats.push({x:t.x, y:t.y-TH-8, v:-0.45, l:1.4, s:(tag?tag+' ':'')+'-'+dmg, c: tag?'#ffd24a':'#ff6a6a'});
  if(t.hp <= 0){ t.hp = 0; kill(t); }
}
function kill(t){
  if(t.dead) return;
  t.dead = true;
  boom(1.7); shake = Math.max(shake, 16); flash = 1;
  for(let i=0;i<80;i++){
    const a = rnd(0,Math.PI*2), sp = rnd(0.5,5);
    parts.push({x:t.x, y:t.y-5, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-1.2, l:rnd(.4,1.3),
      c: i%3?'#ffcf5a':'#ff5a3c', g:0.1, s: i%5===0?3:2});
  }
  parts.push({ring:1,x:t.x,y:t.y-5,r:3,max:90,l:0.6,c:'#fff'});
}

/* ---------------- 정착(낙하) ---------------- */
function settleUpdate(){
  let moving = false;
  for(const t of tanks){
    if(t.dead) continue;
    if(t.y >= H){ say('추락!'); kill(t); continue; }
    if(!tankSolidAt(t.x, t.y)){
      moving = true;
      t.py = t.y;                     // 렌더 보간용
      t.y += 3; t.fall += 3;
      if(t.y >= H){ t.y = H; }
      if((t.fall|0) % 9 === 0)
        parts.push({x:t.x+rnd(-6,6), y:t.y-2, vx:rnd(-.4,.4), vy:rnd(-.6,0), l:.4, c:'#9aa0b8', g:0, s:2, smoke:1});
    } else if(t.fall > 0){
      const f = t.fall;
      t.fall = 0; t.py = t.y;
      checkMines(t);                  // 떨어진 자리에 지뢰가 있을 수도
      if(f > 14){
        const dmg = Math.round((f-14)*0.55);
        if(dmg > 0){ hurt(t, dmg, '낙하'); boom(0.5); shake = Math.max(shake, 5); }
        for(let i=0;i<10;i++) parts.push({x:t.x+rnd(-7,7), y:t.y, vx:rnd(-1.2,1.2), vy:rnd(-1.2,-.1), l:.4, c:'#b9a184', g:.08, s:2});
      }
    }
  }
  if(!moving && parts.length < 90){
    if(!teamAlive(0) || !teamAlive(1)) return gameOver();
    if(settleReturn !== null){       // 능력으로 지형만 흔든 것 — 턴은 그대로 유지
      turn = settleReturn; settleReturn = null;
      state = 'aim';
      return;
    }
    nextTurn();
  }
}

function gameOver(){
  const A = teamAlive(0), B = teamAlive(1);
  winTeam = A && !B ? 0 : B && !A ? 1 : -1;
  // winner 는 색·이름 표시에 쓰는 대표 전차 (팀에서 살아남은 첫 전차)
  const rep = winTeam < 0 ? null : tanks.find(t => !t.dead && teamOf(t.i) === winTeam);
  winner = rep ? rep.i : -1;
  state = 'over';
  whistleStop(); chargeStop();
  holding = false;
  // 한 대도 안 맞아야 퍼펙트 — 팀전이면 팀 전원이 무피해여야 한다
  perfect = winTeam >= 0 && tanks.every(t => teamOf(t.i) !== winTeam || t.hp >= t.maxHp);
  killNote = '';
  if(winTeam >= 0){
    const loser = tanks.find(t => t.dead && teamOf(t.i) !== winTeam);
    killNote = loser ? (KILL_NOTE[loser.lastHitBy] || '') : '';
  }
  // 리그 점수 정산
  if(leagueOn() && !league.done){
    if(winTeam >= 0) league.score[winTeam]++;
    league.done = league.score[0] >= leagueNeed() || league.score[1] >= leagueNeed();
  }
  if(perfect){
    // 무피해 완승 — 팡파르
    const N = [523,659,784,1047,1319,1047,1319,1568];
    N.forEach((f,i)=> setTimeout(()=>tone(f, 0.34, 'square', 0.13), i*130));
    setTimeout(()=>{ tone(1568,0.9,'square',0.12); tone(2093,0.9,'sine',0.06); }, N.length*130+90);
    confetti(150);
  } else {
    tone(winner===0?520:392, 0.5, 'square', 0.14, 200);
  }
}

function confetti(n){
  const c = winner>=0 ? COL[winner] : {body:'#ffd24a', light:'#fff', dark:'#e08a3a'};
  const pal = [c.body, c.light, c.dark, '#ffd24a', '#fff2b0'];
  for(let i=0;i<n;i++)
    parts.push({x:rnd(0,W), y:rnd(-60,-4), vx:rnd(-1.1,1.1), vy:rnd(0.6,2.6),
      l:rnd(1.6,3.4), c:pal[i%pal.length], g:0.028, s:(i%3)?2:3});
}

function nextTurn(){
  // 번호 순으로 넘긴다 = 팀이 한 명씩 번갈아 나온다. 격파된 전차는 건너뛴다.
  for(let k=1; k<=tanks.length; k++){
    const n = (turn + k) % tanks.length;
    if(!tanks[n].dead){ turn = n; break; }
  }
  round++;
  // 방사능 지대 정산
  for(let i=zones.length-1;i>=0;i--){
    const z = zones[i];
    for(const t of tanks){
      if(t.dead) continue;
      if(Math.hypot(t.x-z.x, (t.y-5)-z.y) < z.r){
        hurt(t, RAD_DMG, '☢');
      }
    }
    z.turns--;
    if(z.turns <= 0) zones.splice(i,1);
  }
  // 맹독 / 화상 도트딜
  for(const t of tanks){
    if(t.dead) continue;
    if(t.poison > 0){ hurt(t, t.poisonDmg, '독'); t.poison--; }
    if(t.burn > 0 && !t.dead){ hurt(t, t.burnDmg, '화상'); t.burn--; }
  }
  if(!teamAlive(0) || !teamAlive(1)) return gameOver();
  wind = Math.round(srnd(-12,12));
  timer = RID() === 'speed' ? 10 : 30;
  // 은신과 지뢰 속박은 턴 단위로 풀린다
  for(const t of tanks){
    if(t.cloak > 0) t.cloak--;

  }
  if(RID() === 'random') randomizeWeapon(tanks[turn]);
  holding = false; holdP = 0; holdDir = 1; ai = null;
  const t = tanks[turn];
  t.moves = 60;
  t.y = surfaceY(t.x, t.y);
  state = 'aim';
  tone(660,0.08,'square',0.09);
  if(t.com) aiPlan();
  // 방장이 매 턴 정답 스냅샷을 뿌려 누적 오차를 없앤다
  if(net.on && net.role === 'host') netSync();
}

/* ================================================================
   온라인 (PeerJS P2P)
   - 방장(host) = 1P(왼쪽), 참가자(guest) = 2P(오른쪽)
   - 오가는 것은 "입력"뿐. 지형/바람/선공은 시드로 양쪽이 각자 생성한다.
   - 매 턴 방장이 정답 스냅샷을 보내 어긋남을 자동 복구한다.
   ================================================================ */
const NET_PREFIX = 'fortress2p-';        // 공용 브로커에서 방 코드가 겹치지 않도록
const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';   // 헷갈리는 O0I1L 제외
const net = {
  on:false, role:null, code:'', peer:null, conn:null,
  myIdx:0, status:'', err:'', ping:0, lastRx:0
};
let lobby = 'choose';        // choose | hosting | joining | connecting | error
let joinCode = '';
let netAimT = 0, lastSyncTurn = -1;
/* 상대 조준 상태의 최신 수신값 (바로 꽂지 않고 보간용 목표로 쓴다) */
const remote = {x:0, y:0, a:45, w:0, mv:60, p:0, h:false, d:1, has:false};

function makeCode(n){
  let s = '';
  for(let i=0;i<n;i++) s += CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];
  return s;
}
function netSend(m){
  if(net.conn && net.conn.open){ try{ net.conn.send(m); }catch(e){} }
}
function netFail(msg){
  net.err = msg; lobby = 'error'; state = 'lobby';
  net.on = false;
  tone(180,0.3,'sawtooth',0.1,-90);
}
function netClose(){
  try{ if(net.conn) net.conn.close(); }catch(e){}
  try{ if(net.peer) net.peer.destroy(); }catch(e){}
  net.conn = null; net.peer = null; net.on = false; net.role = null;
}

function peerOpts(){ return {debug:0}; }

function netHost(){
  if(typeof Peer === 'undefined') return netFail('PeerJS 를 불러오지 못했습니다 (인터넷 연결 확인)');
  netClose();
  net.role = 'host'; net.myIdx = 0; net.code = makeCode(4);
  lobby = 'hosting'; net.status = '방 개설중...'; net.err = '';
  const p = new Peer(NET_PREFIX + net.code, peerOpts());
  net.peer = p;
  p.on('open', ()=>{ net.status = '상대 접속 대기중'; tone(880,0.1,'square',0.1,200); });
  p.on('error', e=>{
    if(e && e.type === 'unavailable-id'){ netHost(); return; }   // 코드 충돌 → 재발급
    netFail('연결 오류: ' + (e && e.type ? e.type : e));
  });
  p.on('connection', c=>{
    if(net.conn && net.conn.open){ try{ c.close(); }catch(e){} return; }  // 1:1 만
    net.conn = c;
    c.on('open', ()=>{
      net.on = true; net.lastRx = performance.now();
      // 방장이 판 설정을 정하고 시작 신호를 보낸다
      const seed = (Math.random()*0xFFFFFFFF)>>>0;
      const map = MAPS[mapSel].id;
      netSend({t:'start', seed, map, rule, colors:colSel.slice(), lg:leagueSel, lgs:[league.score[0],league.score[1],league.game]});
      startGame({seed, map});
      netSync();                 // 첫 턴부터 게스트를 정답 상태에 맞춰둔다
      tone(660,0.12,'square',0.12,300);
    });
    c.on('data', netRecv);
    c.on('close', ()=>{ if(net.on) netFail('상대가 접속을 끊었습니다'); });
    c.on('error', ()=>{ if(net.on) netFail('통신 오류'); });
  });
}

function netJoin(code){
  if(typeof Peer === 'undefined') return netFail('PeerJS 를 불러오지 못했습니다 (인터넷 연결 확인)');
  netClose();
  net.role = 'guest'; net.myIdx = 1; net.code = code;
  lobby = 'connecting'; net.status = code + ' 방에 접속중...'; net.err = '';
  const p = new Peer(peerOpts());
  net.peer = p;
  p.on('open', ()=>{
    const c = p.connect(NET_PREFIX + code, {reliable:true});
    net.conn = c;
    const guard = setTimeout(()=>{ if(!net.on) netFail(code + ' 방을 찾을 수 없습니다'); }, 12000);
    c.on('open', ()=>{ clearTimeout(guard); net.on = true; net.lastRx = performance.now();
      net.status = '접속됨 — 방장의 시작을 기다리는 중'; });
    c.on('data', netRecv);
    c.on('close', ()=>{ if(net.on) netFail('상대가 접속을 끊었습니다'); });
    c.on('error', ()=>{ clearTimeout(guard); netFail('상대에게 연결하지 못했습니다'); });
  });
  p.on('error', e=>{
    const ty = e && e.type;
    netFail(ty === 'peer-unavailable' ? code + ' 방을 찾을 수 없습니다' : '연결 오류: ' + ty);
  });
}

/* 지형 체크섬 — 어긋남 감지용 (전 픽셀 훑으면 무거우니 표본만) */
function terrHash(){
  let h = 2166136261;
  for(let i=0;i<terr.length;i+=13){ h ^= terr[i]; h = Math.imul(h, 16777619); }
  return h>>>0;
}
function terrRLE(){
  const out = []; let v = terr[0], n = 1;
  for(let i=1;i<terr.length;i++){
    if(terr[i] === v && n < 65000) n++;
    else { out.push(v, n); v = terr[i]; n = 1; }
  }
  out.push(v, n); return out;
}
function terrApplyRLE(a){
  let i = 0;
  for(let k=0;k<a.length;k+=2){ const v = a[k], n = a[k+1]; for(let j=0;j<n;j++) terr[i++] = v; }
  repaintTerr();
}
/* terr 배열만 보고 화면을 다시 그린다 (깊이는 열마다 추정) */
function repaintTerr(){
  terrImg = terrCtx.createImageData(W,H);
  for(let x=0;x<W;x++){
    let top = -1;
    for(let y=0;y<H;y++){
      const m = terr[y*W+x];
      if(!m){ continue; }
      if(top < 0) top = y;
      const d = y - top;
      let r,g,b;
      const nz = ((Math.sin(x*0.37+y*0.11)*0.5+0.5)*10)|0;
      if(m===1){ r=98+nz; g=196+nz; b=74+nz; if(d===0){ r=140; g=232; b=110; } }
      else if(m===2){ r=132+nz; g=88+nz; b=52+nz; }
      else if(m===4){ r=46+((x*7+y*3)%10); g=32; b=26; }
      else { r=74+nz; g=70+nz; b=84+nz; }
      setPix(x,y,r,g,b,255);
    }
  }
  terrDirty = true;
}

function tankState(t){
  return {x:t.x, y:t.y, hp:t.hp, dead:t.dead, ammo:t.ammo.map(a=>a===Infinity?-1:a),
    shield:t.shield, su:t.shieldUses, weapon:t.weapon, angle:t.angle, moves:t.moves,
    ab:t.abil, au:t.abilUses, hi:t.hits, ck:t.cloak, ifr:t.iframe, mh:t.maxHp, st:t.stunUntil,
    bu:t.burn, bd:t.burnDmg, fl:t.flame, po:t.poison, pd:t.poisonDmg,
    am:t.amp, ve:t.venom, mg:t.homing};
}
function applyTankState(t, s){
  t.x=s.x; t.y=s.y; t.hp=s.hp; t.dead=s.dead; t.shield=s.shield; t.shieldUses=s.su;
  t.weapon=s.weapon; t.angle=s.angle; t.moves=s.moves;
  t.ammo = s.ammo.map(a=>a<0?Infinity:a);
  if(s.ab !== undefined){
    t.abil=s.ab; t.abilUses=s.au; t.hits=s.hi; t.cloak=s.ck; t.iframe=s.ifr; t.maxHp=s.mh; t.stunUntil=s.st;
    t.burn=s.bu; t.burnDmg=s.bd; t.flame=s.fl; t.poison=s.po; t.poisonDmg=s.pd;
    t.amp=s.am; t.venom=s.ve; t.homing=s.mg;
  }
}
function netSync(force){
  if(!force && lastSyncTurn === round) return;
  lastSyncTurn = round;
  netSend({t:'sync', turn, wind, round, rng:rngState,
    tanks: tanks.map(tankState),
    zones: zones.map(z=>({x:z.x,y:z.y,r:z.r,turns:z.turns,t:z.t})),
    mines: mines.map(i=>({x:i.x,y:i.y,r:i.r,owner:i.owner,t:i.t})),
    th: terrHash()});
}

let pendingFire = null, desyncs = 0, syncFlash = 0;
/* 턴 인식이 어긋났을 때. 양쪽이 서로 상대를 따라가면 턴이 맞바뀌며 계속 도니까
   방장을 단일 권위로 둔다: 게스트만 따라가고, 방장은 정답을 다시 쏴준다.
   true 를 돌려주면 이 메시지를 계속 처리해도 된다는 뜻. */
function resolveTurn(si){
  if(net.role === 'guest'){
    turn = si;
    holding = false; holdP = 0; chargeStop();
    remote.has = false;
    desyncs++; syncFlash = 1.2;
    say('턴 동기화 보정');
    return true;
  }
  netSync(true);          // 방장: 내 상태가 정답이다
  desyncs++; syncFlash = 1.2;
  return false;
}

/* 상대 발사를 적용한다. 아직 받을 수 있는 상태가 아니면 false (보류) */
function applyFire(m){
  const si = 1-net.myIdx;
  const t = tanks[si];
  if(!t || t.dead) return true;                 // 버려도 되는 경우
  if(m.r !== undefined && m.r !== round) return true;   // 지난 라운드 → 폐기
  if(state !== 'aim') return false;             // 아직 정리중 → 보류
  if(turn !== si && !resolveTurn(si)) return true;      // 방장이면 무시하고 정답 재전송
  t.x = m.x; t.y = m.y; t.angle = m.a; t.weapon = m.w;
  holding = false; chargeStop();
  remote.has = false;
  fire(t, m.p);
  return true;
}

function netRecv(m){
  net.lastRx = performance.now();
  if(!m || !m.t) return;
  switch(m.t){
    case 'start':
      mode = 2;                       // 온라인은 항상 1 vs 1
      // 규칙은 방장 것을 따른다. 규칙에 따라 시드 소비량이 달라져서
      // 이게 어긋나면 지형·선공까지 전부 어긋난다.
      if(m.rule !== undefined) rule = m.rule;
      if(m.lg !== undefined) leagueSel = m.lg;
      startGame({seed:m.seed, map:m.map, colors:m.colors, league:m.lgs});
      say('규칙 — '+RULES[rule].name);
      break;

    case 'aim': {                       // 상대가 조준하는 모습을 실시간으로
      const si = 1-net.myIdx;           // 보낸 쪽 = 지금 턴 주인
      const t = tanks[si];
      if(!t) break;
      if(m.r !== round) break;          // 지난 라운드의 늦은 메시지는 버린다
      if(turn !== si && !resolveTurn(si)) break;
      remote.x=m.x; remote.y=m.y; remote.a=m.a; remote.w=m.w; remote.mv=m.mv;
      remote.p=m.p; remote.h=m.h; remote.d=m.d; remote.has=true;
      break;
    }
    case 'fire':
      // 아직 이전 턴 정리가 안 끝났으면 흘리지 말고 물고 있다가 쏜다.
      // (여기서 그냥 버리면 한쪽만 발사돼 판이 어긋난다)
      if(!applyFire(m)) pendingFire = m;
      break;
    case 'shield':
      tryShield(1-net.myIdx, true);
      break;
    case 'abil':
      useAbility(m.i, true, m.arg);
      break;

    case 'sync': {                      // 방장이 보낸 정답 상태
      if(net.role === 'host') break;
      if(m.turn !== turn){ holding = false; holdP = 0; chargeStop(); remote.has = false; syncFlash = 1.2; }
      turn = m.turn; wind = m.wind; round = m.round; rngState = m.rng;
      pendingFire = null;
      for(let k=0;k<tanks.length && k<m.tanks.length;k++) applyTankState(tanks[k], m.tanks[k]);
      zones = m.zones.map(z=>({x:z.x,y:z.y,r:z.r,turns:z.turns,t:z.t}));
      mines = m.mines.map(i=>({x:i.x,y:i.y,r:i.r,owner:i.owner,t:i.t}));
      if(m.th !== terrHash()) netSend({t:'needterr'});   // 지형이 어긋났다 → 통째로 요청
      break;
    }
    case 'needterr':
      if(net.role === 'host') netSend({t:'terr', d:terrRLE()});
      break;
    case 'terr':
      terrApplyRLE(m.d);
      say('지형 재동기화 완료');
      break;

    case 'rematch':
      if(net.role === 'host'){
        const seed = (Math.random()*0xFFFFFFFF)>>>0;
        const map = MAPS[mapSel].id;
        netSend({t:'start', seed, map, rule, colors:colSel.slice(), lg:leagueSel, lgs:[league.score[0],league.score[1],league.game]});
        startGame({seed, map});
      }
      break;
    case 'bye':
      netFail('상대가 나갔습니다');
      break;
  }
}

/* 내 턴일 때 조준 상태를 흘려보낸다 (20Hz) */
function netAimTick(dt){
  if(!net.on) return;
  if(pendingFire && applyFire(pendingFire)) pendingFire = null;   // 밀린 발사 처리
  if(state !== 'aim' || turn !== net.myIdx) return;
  netAimT -= dt;
  if(netAimT > 0) return;
  netAimT = 0.05;
  const t = tanks[net.myIdx];
  netSend({t:'aim', r:round, x:t.x, y:t.y, a:t.angle, w:t.weapon, mv:t.moves,
           h:holding, p:holdP, d:holdDir});
}

/* 받은 값을 그대로 꽂으면 20Hz 로 툭툭 끊긴다.
   위치·각도는 부드럽게 따라가고, 파워 게이지는 같은 속도로 로컬 예측(추측항법)한 뒤
   수신값으로 살살 보정한다. 그래서 지연이 있어도 애니메이션이 매끄럽게 이어진다. */
function netInterp(dt){
  if(!net.on || !remote.has) return;
  const si = 1-net.myIdx, t = tanks[si];
  if(!t || t.dead || turn !== si || state !== 'aim') return;

  const k = Math.min(1, dt*13);
  t.x     += (remote.x - t.x) * k;
  t.y     += (remote.y - t.y) * k;
  t.angle += (remote.a - t.angle) * k;
  t.weapon = remote.w; t.moves = remote.mv;

  if(remote.h){
    if(!holding){ holding = true; holdP = remote.p; holdDir = remote.d; }
    holdDir = remote.d;
    // 목표값과 표시값을 같은 물리로 함께 굴린다
    remote.p += remote.d*62*dt;
    if(remote.p >= 100){ remote.p = 100; remote.d = -1; }
    else if(remote.p <= 0){ remote.p = 0; remote.d = 1; }
    holdP += holdDir*62*dt;
    if(holdP >= 100) holdP = 100; else if(holdP <= 0) holdP = 0;
    holdP += (remote.p - holdP) * Math.min(1, dt*4);   // 누적 오차만 서서히 흡수
  } else if(holding){
    holding = false; holdP = 0;
  }
}

/* ---------------- 시작 ---------------- */
let stars = [];
/* 배치용: 바닥에서 위로 훑어 '가장 아래 땅덩어리'의 윗면을 찾는다.
   동굴 천장 위나 지형 속에 끼워 넣는 사고를 막는다. 땅이 없으면 H */
function groundSpawnY(x){
  let y = H-1;
  while(y >= 0 && !tankSolidAt(x,y)) y--;
  if(y < 0) return H;
  while(y >= 0 && tankSolidAt(x,y)) y--;
  return y+1;
}
/* 랜덤전: 턴이 올 때마다 쏠 포탄이 정해진다.
   시드 PRNG 를 쓰지 않는다 — 온라인에서는 실제 사용 포탄이 fire/aim 메시지에 실려
   상대에게 그대로 전달되므로 각자 굴려도 어긋나지 않는다. */
function randomizeWeapon(t){
  if(!t) return;
  t.weapon = Math.floor(Math.random()*WEAPONS.length);
  if(!t.com) say('이번 포탄 — ' + WEAPONS[t.weapon].name);
}

function spawnX(lo, hi){
  for(let k=0;k<60;k++){
    const x = Math.round(srnd(lo,hi));
    if(groundSpawnY(x) < H-4) return x;
  }
  for(let x=Math.round(lo); x<=hi; x++) if(groundSpawnY(x) < H-4) return x;
  return Math.round((lo+hi)/2);
}

/* opts.seed / opts.map / opts.colors 가 오면 그대로 쓴다 (온라인: 양쪽 동일).
   시드 소비 순서가 양쪽에서 같아야 하므로 아래 순서를 바꾸면 안 된다. */
function startGame(opts){
  opts = opts || {};
  // 새 매치면 리그 점수를 지운다. 다음 판이면 이어간다.
  if(opts.league) { league.score = opts.league.slice(0,2); league.game = opts.league[2]; league.done = false; }
  else if(!opts.keepLeague) leagueReset();
  gameSeed = (opts.seed !== undefined) ? (opts.seed>>>0) : ((Math.random()*0xFFFFFFFF)>>>0);
  srand(gameSeed);
  if(opts.colors) colSel = opts.colors.slice();
  // 팀 색을 그대로 쓴다 — 같은 팀은 같은 색, 전차에 번호를 찍어 구분한다
  COL = [0,1,2,3].map(i => PALETTE[colSel[teamOf(i)]]);

  genTerrain(opts.map || MAPS[mapSel].id);          // ① 시드 소비
  if(isQuad()){                                      // ② 시드 소비 — 2 vs 2
    tanks = [makeTank(0, spawnX(40,110)),  makeTank(1, spawnX(W-110,W-40)),
             makeTank(2, spawnX(130,215)), makeTank(3, spawnX(W-215,W-130))];
  } else {
    tanks = [makeTank(0, spawnX(46,132)), makeTank(1, spawnX(W-132,W-46))];
  }
  // 뒤쪽 자리부터 COM 이 채운다 (사람은 항상 1P 부터)
  for(let k=0; k<comCount(); k++) tanks[tanks.length-1-k].com = true;
  for(const t of tanks) t.y = groundSpawnY(t.x);
  shots.length = 0; parts.length = 0; zones.length = 0; mines.length = 0;
  replayReset(); killNote = ''; fireSeq = 0;
  floats.length = 0; trail.length = 0;
  turn = Math.floor(sr()*tanks.length); round = 0;   // ③ 시드 소비
  wind = Math.round(srnd(-12,12));                   // ④ 시드 소비

  // ── 규칙별 초기 설정 ──
  if(RID() === 'basic' || RID() === 'random'){
    for(const t of tanks){
      t.ammo = WEAPONS.map(()=>Infinity);            // 탄약 걱정 없이
      t.weapon = 0;
    }
  }
  if(RID() === 'power'){                             // ⑤ 시드 소비 — 양쪽 동일한 능력 배분
    for(const t of tanks) t.abil = Math.floor(sr()*ABILITIES.length);
    for(const t of tanks){
      const A = ABILITIES[t.abil];
      t.maxHp = A.hp; t.hp = A.hp;                   // 능력마다 체력이 다르다
      t.shieldUses = SHIELD_USES + (A.shield || 0);
      t.ammo = WEAPONS.map(w => w.ammo === Infinity ? Infinity : w.ammo*2);   // 특수탄 2배
    }
  }
  if(RID() === 'random') for(const t of tanks) randomizeWeapon(t);

  timer = RID() === 'speed' ? 10 : 30;
  winner = -1; shake = 0; flash = 0; simAcc = 0; slowmo = 0;
  holding = false; holdP = 0; holdDir = 1; ai = null;
  perfect = false; comShieldT = -1;
  netAimT = 0; lastSyncTurn = -1; pendingFire = null; settleReturn = null;
  remote.has = false; syncFlash = 0;
  state = 'aim';
  say(MAPS.find(m=>m.id===curMap).name + ' — 교전 개시');
  if(tanks[turn].com) aiPlan();
}
stars = Array.from({length:70},()=>({x:rnd(0,W), y:rnd(0,150), b:rnd(0.2,1), p:rnd(0,6.3)}));

/* ---------------- 그리기 ---------------- */
function drawSky(t){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0b1030'); g.addColorStop(0.55,'#2a2350'); g.addColorStop(1,'#6a3f5a');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  for(const s of stars){
    const a = 0.35 + Math.sin(t*1.6+s.p)*0.3;
    ctx.fillStyle = 'rgba(255,255,255,'+(a*s.b).toFixed(2)+')';
    ctx.fillRect(s.x|0, s.y|0, 1, 1);
  }
  // 달
  ctx.fillStyle = '#f4eeda'; ctx.beginPath(); ctx.arc(548, 56, 17, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#e6dcc0';
  ctx.fillRect(542,50,4,4); ctx.fillRect(552,62,5,3); ctx.fillRect(546,64,3,3);
  // 원경 산맥
  ctx.fillStyle = '#241d3c';
  ctx.beginPath(); ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=16) ctx.lineTo(x, 210 + Math.sin(x*0.017)*26 + Math.sin(x*0.041)*13);
  ctx.lineTo(W,H); ctx.fill();
  ctx.fillStyle = '#1a1530';
  ctx.beginPath(); ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=12) ctx.lineTo(x, 238 + Math.sin(x*0.026+2)*20 + Math.sin(x*0.06)*8);
  ctx.lineTo(W,H); ctx.fill();
}

function drawTank(t){
  if(t.dead) return;
  if(t.cloak > 0){                    // 은신 — 윤곽만 어른거린다
    ctx.save();
    ctx.globalAlpha = 0.22 + Math.sin(performance.now()/120)*0.08;
  }
  const c = COL[t.i], x = Math.round(t.x);
  // 낙하 중에는 스텝 사이를 보간해서 그린다 (안 그러면 3px 씩 툭툭 떨어진다)
  const y = Math.round(
    (state === 'settle' && t.py !== undefined && t.py !== t.y)
      ? t.py + (t.y - t.py)*simAlpha()
      : t.y);
  // 포신
  const a = t.angle*Math.PI/180;
  const px = x, py = y-TH+1;
  ctx.strokeStyle = c.dark; ctx.lineWidth = 4; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+Math.cos(a)*14, py-Math.sin(a)*14); ctx.stroke();
  ctx.strokeStyle = c.light; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+Math.cos(a)*13, py-Math.sin(a)*13); ctx.stroke();
  // 몸통
  ctx.fillStyle = c.dark;  ctx.fillRect(x-TW, y-6, TW*2+1, 6);
  ctx.fillStyle = c.body;  ctx.fillRect(x-TW, y-7, TW*2+1, 5);
  ctx.fillStyle = c.light; ctx.fillRect(x-TW+1, y-7, TW*2-1, 1);
  // 포탑
  ctx.fillStyle = c.body;  ctx.fillRect(x-4, y-11, 9, 5);
  ctx.fillStyle = c.light; ctx.fillRect(x-3, y-11, 7, 1);
  // 팀전은 같은 색이라 번호로 구분한다
  if(isQuad()) txt((t.i+1)+'', x+0.5, y-10, c.dark, 8, 'center');
  // 궤도
  ctx.fillStyle = '#2b2f42'; ctx.fillRect(x-TW-1, y-3, TW*2+3, 3);
  ctx.fillStyle = '#454a63';
  for(let i=-TW;i<=TW;i+=3) ctx.fillRect(x+i, y-2, 2, 1);
  // 보호막
  if(t.shield > 0){
    const T = performance.now()/1000;
    const fade = clamp(t.shield/0.6, 0, 1);
    const r = 21 + Math.sin(T*9)*1.2;
    ctx.save();
    ctx.globalAlpha = fade*0.85;
    ctx.strokeStyle = '#6cf0c8'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x, y-6, r, 0, 6.3); ctx.stroke();
    ctx.globalAlpha = fade*0.35;
    ctx.beginPath(); ctx.arc(x, y-6, r-3, 0, 6.3); ctx.stroke();
    // 회전하는 육각 마디
    ctx.globalAlpha = fade;
    ctx.fillStyle = '#9af0f0';
    for(let k=0;k<6;k++){
      const a = T*1.8 + k*Math.PI/3;
      ctx.fillRect(Math.round(x+Math.cos(a)*r)-1, Math.round(y-6+Math.sin(a)*r)-1, 3, 3);
    }
    // 남은 시간 호
    ctx.globalAlpha = fade*0.9;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y-6, r+3, -Math.PI/2, -Math.PI/2 + (t.shield/SHIELD_TIME)*6.283);
    ctx.stroke();
    ctx.restore();
  }
  if(t.cloak > 0) ctx.restore();
  // 중독 표시
  if(t.poison > 0){
    const T = performance.now()/700;
    ctx.fillStyle = '#c07aff';
    for(let k=0;k<3;k++){
      const ph = (T + k/3) % 1;
      ctx.globalAlpha = 1-ph;
      ctx.fillRect(Math.round(x-6+k*5+Math.sin((T+k)*6)*2), Math.round(y-14-ph*12), 2, 2);
    }
    ctx.globalAlpha = 1;
  }
  // 턴 표시
  if(state==='aim' && turn===t.i){
    const bob = Math.sin(performance.now()/180)*2;
    ctx.fillStyle = c.light;
    const ay = y-24+bob;
    ctx.fillRect(x-3, ay, 7, 2); ctx.fillRect(x-2, ay+2, 5, 2);
    ctx.fillRect(x-1, ay+4, 3, 2); ctx.fillRect(x, ay+6, 1, 2);
  }
}

function bar(x,y,w,h,v,col,bg){
  ctx.fillStyle = bg||'#131730'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle = col; ctx.fillRect(x+1,y+1,Math.max(0,Math.round((w-2)*v)),h-2);
  ctx.strokeStyle = '#3b4470'; ctx.lineWidth = 1;
  ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
}
function txt(s,x,y,col,size,align){
  ctx.font = 'bold '+(size||10)+'px "Malgun Gothic",monospace';
  ctx.textAlign = align||'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#000'; ctx.fillText(s,x+1,y+1);
  ctx.fillStyle = col; ctx.fillText(s,x,y);
}

  }

  for(let i=0;i<tanks.length;i++){

    // 보호막 잔량
    for(let k=0;k<SHIELD_USES;k++){
      const bx = x+36+k*10, on = k < t.shieldUses;

      ctx.fillStyle = on ? '#0a2a26' : '#151b33';

    }
    if(t.shield > 0)
      txt(t.shield.toFixed(1)+'s', x+36+SHIELD_USES*10+4, 4, '#6cf0c8', 9);
    const fr = t.maxHp ? t.hp/t.maxHp : 0;
    txt(t.dead?'격파':(t.hp+(t.maxHp!==100?'/'+t.maxHp:'')), x+140, 4,
        fr>0.5?'#9dffa0':fr>0.25?'#ffd24a':'#ff6a6a', 10, 'right');
    bar(x, 16, 140, 9, fr, fr>0.5?'#4ad46a':fr>0.25?'#e0b23a':'#e04a4a');
    if(turn===i && state==='aim'){
      ctx.strokeStyle = COL[i].light; ctx.lineWidth=1;
      ctx.strokeRect(x-2.5, 1.5, 145, 26);
    }
    // 초능력 슬롯
    const A = abilOf(t);
    if(A){
      const ax = i===0 ? 6 : W-146, ay = 28;
      const rdy = t.abilUses > 0;
      ctx.fillStyle = rdy ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.03)';
      ctx.fillRect(ax, ay, 140, 13);
      ctx.strokeStyle = rdy ? A.col : '#2c3358'; ctx.lineWidth = 1;
      ctx.strokeRect(ax+0.5, ay+0.5, 139, 12);
      txt((i===0?'Q':'/')+'  '+A.name, ax+5, ay+2, rdy?A.col:'#4a4f6a', 9);
      // 남은 충전 수 / 다음 충전까지 남은 명중 수
      txt(rdy ? '×'+t.abilUses : (HITS_PER_USE - t.hits%HITS_PER_USE)+'대 남음',
          ax+135, ay+2, rdy?'#9dffa0':'#4a4f6a', 9, 'right');
      // 이름과 붙지 않도록 가운데에서 왼쪽 정렬로 띄운다
      if(t.cloak > 0) txt('은신 '+t.cloak+'턴', ax+66, ay+2, '#9ad8ff', 9);
      else if(t.iframe > 0) txt('무적 '+t.iframe.toFixed(1)+'s', ax+66, ay+2, '#6cf0c8', 9);
      else if(t.burn > 0) txt('화상 '+t.burn, ax+66, ay+2, '#ff5c9a', 9);
      else if(t.poison > 0) txt('중독 '+t.poison, ax+66, ay+2, '#c07aff', 9);
      else if(t.amp) txt('강화탄', ax+66, ay+2, '#ff7a5c', 9);
      else if(t.venom) txt('맹독', ax+66, ay+2, '#c07aff', 9);
      else if(t.flame) txt('불꽃탄', ax+66, ay+2, '#ff5c9a', 9);
      else if(t.homing) txt('유도', ax+66, ay+2, '#ffb04a', 9);

/* 포탄 비행중 — 맞을 쪽에게 보호막 안내 (상대 팀 전원에게) */
function drawShieldPrompt(){
  if(state !== 'fly') return;
  const sh = tanks[turn];
  if(!sh) return;
  const bl = Math.sin(performance.now()/110)*0.5+0.5;
  const col = 'rgba(108,240,200,'+(0.3+bl*0.7).toFixed(2)+')';
  for(const k of [0,1]){
    if(k === teamOf(sh.i)) continue;
    const ready = tanks.some(d => teamOf(d.i)===k && !d.dead && !d.com && d.shieldUses>0 && d.shield<=0);
    if(!ready) continue;
    txt((k===0?'왼쪽':'오른쪽')+' SHIFT — 보호막!', k===0?6:W-6, isQuad()?32:33, col, 9, k===0?'left':'right');
  }
}

function drawWind(){
  txt('바람', W/2, 3, '#8f9ad0', 9, 'center');
  const wx = W/2, wy = 18, aw = Math.abs(wind);
  ctx.fillStyle = wind===0 ? '#8f9ad0' : (wind>0 ? '#7ad0ff' : '#ff9ad0');
  if(wind !== 0){
    const dir = Math.sign(wind);
    for(let i=0;i<Math.min(6,Math.ceil(aw/2));i++){
      const px = wx + dir*(6+i*5);
      ctx.fillRect(px-2, wy-1, 4, 2);
    }
    ctx.fillRect(wx+dir*(6+Math.min(6,Math.ceil(aw/2))*5)-1, wy-3, 2, 6);
  }
  txt((wind>0?'▶ ':wind<0?'◀ ':'')+aw, wx, wy+4, '#cfd6ff', 9, 'center');
}

function drawAimPanel(){
  if(state !== 'aim' && state !== 'fly') return;

  // 하단 조준 패널
  const t = tanks[turn];
  const py = H-46;
  ctx.fillStyle = 'rgba(8,10,26,0.82)'; ctx.fillRect(0,py,W,46);
  ctx.fillStyle = '#3b4470'; ctx.fillRect(0,py,W,1);

  const elev = Math.round(t.dir>0 ? t.angle : 180-t.angle);
  txt('각도', 8, py+5, '#8f9ad0', 9);
  txt(elev+'°', 44, py+4, '#ffe08a', 11);
  txt('이동', 8, py+19, isStunned(t)?'#ff6a6a':'#8f9ad0', 9);
  if(isStunned(t)) txt('지뢰 묶임', 34, py+18, '#ff6a6a', 9);
  else bar(34, py+20, 52, 7, t.moves/60, '#6cf0c8');
  txt('시간', 8, py+32, '#8f9ad0', 9);
  bar(34, py+33, 52, 7, clamp(timer/30,0,1), timer<8?'#e04a4a':'#e0b23a');

  // 파워 게이지
  txt('파워', 100, py+5, '#8f9ad0', 9);
  const pw = holding||state==='fly' ? (state==='fly'? t.power : holdP) : holdP;
  bar(100, py+17, 150, 12, pw/100, holding?'#ff6a4a':'#ffb04a');
  for(let i=1;i<10;i++){ ctx.fillStyle='#000'; ctx.fillRect(100+i*15, py+18, 1, 10); }
  txt(Math.round(pw)+'', 254, py+18, '#ffe08a', 11);
  const fk = CTRL[teamOf(t.i)].fire[0]==='Space' ? 'SPACE' : 'ENTER';
  const hint = t.com
    ? (ai ? (ai.phase==='think'?'COM 계산중...':ai.phase==='turn'?'COM 조준중...':'COM 충전중...') : 'COM 발사')
    : (holding ? '놓으면 발사 (100 넘으면 0부터 다시)' : fk+' 길게 눌러 충전');
  txt(hint, 130, py+5, t.com?'#a8b0d8':(holding?'#ff9a6a':'#5f6a9a'), 9);
  if(!t.com) txt(label(t.i)+' 조작  '+CTRL[teamOf(t.i)].label, 100, py+32, COL[t.i].light, 9);

  // 무기 슬롯
  for(let i=0;i<WEAPONS.length;i++){
    const w = WEAPONS[i], bx = 292 + i*57, sel = t.weapon===i;
    const out = t.ammo[i] === 0;
    ctx.fillStyle = sel ? 'rgba(255,255,255,0.13)' : 'rgba(255,255,255,0.04)';
    ctx.fillRect(bx, py+6, 53, 32);
    ctx.strokeStyle = sel ? w.color : '#2c3358'; ctx.lineWidth=1;
    ctx.strokeRect(bx+0.5, py+6.5, 52, 31);
    txt((i+1)+'', bx+4, py+8, sel?w.color:'#5f6a9a', 9);
    txt(w.name, bx+26, py+8, out?'#4a4f6a':(sel?'#fff':'#a8b0d8'), 9, 'center');
    const am = t.ammo[i];
    txt(am===Infinity?'∞':am+'발', bx+26, py+22, out?'#4a4f6a':(am===Infinity?'#8f9ad0':'#ffd24a'), 10, 'center');
  }
}

function drawAimGuide(){
  if(state !== 'aim') return;

  const sx = t.x + Math.cos(a)*16, sy = (t.y-TH) - Math.sin(a)*16;
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for(let i=0;i<7;i++){
    const d = 18 + i*7;
    ctx.fillRect(Math.round(t.x + Math.cos(a)*d), Math.round((t.y-TH) - Math.sin(a)*d), 2, 2);

function drawWorld(t){
  // 지난 탄도
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  for(let i=0;i<trail.length;i+=2) ctx.fillRect(trail[i].x|0, trail[i].y|0, 1, 1);

  // 방사능 지대
  for(const z of zones){
    const pul = 0.5 + Math.sin(t*3 + z.t)*0.5;
    ctx.fillStyle = 'rgba(140,255,80,'+(0.07+pul*0.06).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, 6.3); ctx.fill();
    ctx.strokeStyle = 'rgba(160,255,90,'+(0.35+pul*0.35).toFixed(2)+')'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, 6.3); ctx.stroke();
    txt('☢ '+z.turns, z.x, z.y-z.r-11, '#a8ff5c', 9, 'center');
  }
  // 요격기
  for(const m of mines){
    const pul = 0.5+Math.sin(t*4 + m.x*0.05)*0.5;
    // 밟히는 범위
    ctx.strokeStyle = 'rgba(108,240,200,'+(0.10+pul*0.13).toFixed(2)+')'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.3); ctx.stroke();
    ctx.fillStyle = 'rgba(108,240,200,0.05)';
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.3); ctx.fill();
    // 땅에 박힌 본체
    ctx.fillStyle = '#2a6a5a'; ctx.fillRect(m.x-4, m.y-2, 9, 4);
    ctx.fillStyle = '#6cf0c8'; ctx.fillRect(m.x-3, m.y-3, 7, 2);
    ctx.fillStyle = pul>0.55 ? '#fff' : '#1a4a3a';
    ctx.fillRect(m.x-1, m.y-5, 2, 2);
  }
}

function drawParticles(){
  for(const p of parts){
    if(p.ring){
      ctx.strokeStyle = p.c; ctx.globalAlpha = clamp(p.l*2.4,0,1); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.3); ctx.stroke();
      ctx.globalAlpha = 1; continue;
    }
    ctx.globalAlpha = p.smoke ? clamp(p.l*0.55,0,0.5) : clamp(p.l*2.2,0,1);
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x|0, p.y|0, p.s, p.s);
  }
  ctx.globalAlpha = 1;
}

/* 물리는 1/60 고정 스텝인데 화면은 그와 다른 주기로 그려진다.
   그대로 그리면 한 프레임에 2스텝 → 다음 프레임에 0스텝 이 되며 툭툭 끊긴다.
   마지막 두 스텝 사이를 남은 시간 비율로 보간해서 그린다. */
function simAlpha(){ return clamp(simAcc / SIM_STEP, 0, 1); }

function drawShots(){
  const al = simAlpha();
  for(const p of shots){
    const px = (p.px === undefined ? p.x : p.px + (p.x - p.px)*al);
    const py = (p.py === undefined ? p.y : p.py + (p.y - p.py)*al);
    const rx = Math.round(px), ry = Math.round(py);
    ctx.fillStyle = p.w.color;
    ctx.fillRect(rx-2, ry-2, 5, 5);
    ctx.fillStyle = '#fff';
    ctx.fillRect(rx-1, ry-1, 3, 3);
  }
}

    ['1 ~ 6', '1 ~ 6', '포탄 선택'],
    ['왼쪽 SHIFT', '오른쪽 SHIFT', '보호막 '+SHIELD_TIME+'초 (상대 포탄 비행중에만)'],
  ];
