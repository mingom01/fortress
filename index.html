/* ---------------- 하이라이트 리플레이 ----------------
   화면을 절반 해상도로 축소해 링버퍼에 담아둔다. 포탄이 날아가는 동안만 기록하므로
   격파 직전 장면이 항상 버퍼에 남는다. 프레임 40장 × 320x180 이면 부담이 없다. */
const replay = {
  frames: [], max: 44, w: 320, h: 180,
  pool: [], idx: 0, t: 0, playing: false, playT: 0, cur: 0
};
function replayGrab(){
  if(replay.pool.length < replay.max){
    const c = document.createElement('canvas');
    c.width = replay.w; c.height = replay.h;
    replay.pool.push(c);
  }
  const c = replay.pool[replay.idx % replay.pool.length];
  replay.idx++;
  c.getContext('2d').drawImage(cv, 0, 0, replay.w, replay.h);
  replay.frames.push(c);
  if(replay.frames.length > replay.max) replay.frames.shift();
}
function replayReset(){ replay.frames.length = 0; replay.idx = 0; replay.t = 0; replay.playing = false; }
function replayStart(){
  if(!replay.frames.length) return;
  replay.playing = true; replay.playT = 0; replay.cur = 0;
  tone(700,0.12,'square',0.1,200);
}
function replayDraw(dt){
  replay.playT += dt;
  const FPS = 18;                                   // 살짝 느리게 — 하이라이트답게
  replay.cur = Math.floor(replay.playT * FPS);
  if(replay.cur >= replay.frames.length){ replay.playing = false; return; }
  const f = replay.frames[replay.cur];
  ctx.fillStyle = '#05060d'; ctx.fillRect(0,0,W,H);
  ctx.drawImage(f, 0, 0, W, H);
  ctx.fillStyle = 'rgba(4,6,18,0.45)'; ctx.fillRect(0, 0, W, 22);
  ctx.fillRect(0, H-20, W, 20);
  const b = Math.sin(performance.now()/200)*0.5+0.5;
  txt('◉ REPLAY', 10, 6, 'rgba(255,90,90,'+(0.5+b*0.5).toFixed(2)+')', 11);
  txt('격파 직전 '+(replay.frames.length/18).toFixed(1)+'초', W-10, 6, '#cfd6ff', 10, 'right');
  // 진행 바
  ctx.fillStyle = '#2c3358'; ctx.fillRect(10, H-11, W-20, 3);
  ctx.fillStyle = '#ffd24a';
  ctx.fillRect(10, H-11, Math.round((W-20)*(replay.cur/replay.frames.length)), 3);
}

/* ---------------- 루프 ---------------- */
let last = performance.now();
function loop(now){
  let dt = (now-last)/1000; last = now;
  dt = Math.min(dt, 0.05);
  const T = now/1000;

  // --- 갱신 ---
  // 비행·낙하는 고정 타임스텝으로 돌린다. 프레임률에 속도가 끌려다니지 않고,
  // 배속(slowFactor)을 곱하는 것만으로 슬로우모션/스피드전을 만들 수 있다.
  // 온라인 결정론에는 영향이 없다 — 총 스텝 수는 충돌로 정해지고 누산기는 "언제" 도는지만 바꾼다.
  if(state === 'aim') (tanks[turn].com ? aiUpdate : aimUpdate)(dt * (RID()==='speed'?1.35:1));
  else if(state === 'fly' || state === 'settle'){
    updateSlowmo();
    simAcc += dt * simSpeed();
    let guard = 0;
    while(simAcc >= SIM_STEP && guard++ < 10){
      simAcc -= SIM_STEP;
      if(state === 'fly') flyUpdate();
      else if(state === 'settle') settleUpdate();
      else break;
    }
  } else { simAcc = 0; slowmo = 0; }
  netInterp(dt);
  netAimTick(dt);
  if(syncFlash > 0) syncFlash -= dt;

  // 연출도 시뮬레이션 배속을 따라간다 (슬로우모션에서 파티클만 제 속도로 날면 어색하다)
  const pf = (state === 'fly' || state === 'settle') ? simSpeed() : 1;
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.l -= dt * pf;
    if(p.l <= 0){ parts.splice(i,1); continue; }
    if(p.ring){ p.r += (p.max-p.r)*0.34*pf; continue; }
    p.x += p.vx*pf; p.y += p.vy*pf; p.vy += (p.g||0)*pf;
    p.vx *= 0.985;
    if(!p.smoke && p.y>0 && solid(p.x|0,p.y|0)){ p.vy *= -0.28; p.vx *= 0.5; p.y -= 1; p.l -= dt*2; }
  }
  for(let i=floats.length-1;i>=0;i--){
    const f = floats[i]; f.l -= dt; f.y += f.v; f.v *= 0.97;
    if(f.l<=0) floats.splice(i,1);
  }
  for(const z of zones) z.t += dt;
  // 보호막 지속시간
  for(const t of tanks){
    if(t.iframe > 0){
      t.iframe -= dt;
      if(t.iframe <= 0){ t.iframe = 0; tone(600,0.15,'sine',0.06,-200); }
    }
    if(t.shield > 0){
      t.shield -= dt;
      if(t.shield <= 0){ t.shield = 0; tone(300,0.18,'triangle',0.07,-140); }
    }
  }
  if(comShieldT > 0){
    comShieldT -= dt;
    if(comShieldT <= 0){ comShieldT = -1; if(comShieldWho >= 0) tryShield(comShieldWho, true); }
  }
  if(state==='over' && perfect && parts.length < 220) confetti(3);
  musicTick();
  if(msgT>0) msgT -= dt;
  shake *= 0.86; if(shake<0.15) shake=0;
  flash *= 0.82; if(flash<0.02) flash=0;

  // --- 그리기 ---
  ctx.save();
  if(shake>0) ctx.translate(Math.round(rnd(-shake,shake)), Math.round(rnd(-shake,shake)));

  drawSky(T);
  if(terrDirty){ terrCtx.putImageData(terrImg,0,0); terrDirty=false; }
  ctx.drawImage(terrCv, 0, 0);

  if(state!=='title' && state!=='menu' && state!=='lobby'){
    drawWorld(T);
    for(const t of tanks) drawTank(t);
    drawAimGuide();
    drawParticles();
    drawShots();
    for(const f of floats){
      ctx.globalAlpha = clamp(f.l,0,1);
      txt(f.s, f.x, f.y, f.c, 10, 'center');
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();

  if(flash>0){ ctx.fillStyle = 'rgba(255,240,200,'+(flash*0.5).toFixed(3)+')'; ctx.fillRect(0,0,W,H); }

  // 결정타 슬로우모션 — 가장자리를 조이고 붉게 물들인다
  if(slowmo > 0 && (state==='fly' || state==='settle')){
    const T = performance.now()/1000;
    const g = ctx.createRadialGradient(W/2, H/2, 90, W/2, H/2, 330);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(40,0,10,0.55)');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    const b = 0.5 + Math.sin(T*7)*0.5;
    ctx.strokeStyle = 'rgba(255,90,60,'+(0.25+b*0.35).toFixed(2)+')';
    ctx.lineWidth = 2; ctx.strokeRect(1,1,W-2,H-2);
  }

  if(state==='title') drawTitle();
  else if(state==='menu') drawMenu();
  else if(state==='lobby') drawLobby();
  else {
    drawHUD();
    drawNetBar();
    if(msgT>0){
      ctx.globalAlpha = clamp(msgT,0,1);
      ctx.fillStyle='rgba(8,10,26,0.8)';
      ctx.font='bold 10px "Malgun Gothic",monospace';
      const tw = ctx.measureText(msg).width+16;
      ctx.fillRect(W/2-tw/2, 38, tw, 16);
      txt(msg, W/2, 41, '#ffe08a', 10, 'center');
      ctx.globalAlpha = 1;
    }
    if(state==='over') drawOver();
  }

  // 포탄이 날아가는 동안만 기록해 둔다 (격파 직전 장면이 항상 남는다)
  if(state === 'fly' || state === 'settle'){
    replay.t += dt;
    if(replay.t >= 1/24){ replay.t = 0; replayGrab(); }
  }
  // 리플레이 재생 중이면 화면을 통째로 덮어쓴다
  if(replay.playing && state === 'over') replayDraw(dt);

  // 스캔라인 (옛날 감성)
  ctx.globalAlpha = 0.05; ctx.fillStyle = '#000';
  for(let y=0;y<H;y+=2) ctx.fillRect(0,y,W,1);
  ctx.globalAlpha = 1;

  requestAnimationFrame(loop);
}
genTerrain();
tanks = [makeTank(0,90), makeTank(1,W-90)];
for(const t of tanks) t.y = surfaceY(t.x, 40);
requestAnimationFrame(loop);
</script>
